       a) <h3 class="flower-name">Sunset Romance</h3>
          ↓
          <h3 class="flower-name">Your Flower Name</h3>

       b) onclick="purchase('Sunset Romance', '$14.99')"
          ↓
          onclick="purchase('Your Flower Name', '$14.99')"

    3️⃣ DESCRIPTION:
       <p class="flower-desc">Gorgeous 3D roses bathed...</p>
       ↓
       <p class="flower-desc">Your description here</p>

    4️⃣ PRICE (both places):
       <div class="flower-price">$14.99</div>
       AND
       onclick="purchase('...', '$14.99')"
       ↓
       Change both to your price

    5️⃣ BADGE (optional):

       - "Premium 3D" → "New" / "Limited" / "Viral"
