                  <span style={{fontSize:"9px",letterSpacing:"2px",
                    color:RGL,fontFamily:SANS}}>{selMusic}</span>
                </div>
              </div>
              <div style={{padding:"24px",background:NAVY3,textAlign:"left"}}>
                {recipient&&<div style={{fontSize:"9px",letterSpacing:"3px",
                  color:RG,marginBottom:"8px",fontFamily:SANS}}>
                  FOR {recipient.toUpperCase()}
                </div>}
                <div style={{fontSize:"16px",lineHeight:"1.85",color:CREAM,
                  fontStyle:"italic",marginBottom:"16px",fontFamily:SERIF}}>
                  "{msg}"
                </div>
                <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
                  <span style={{fontSize:"9px",letterSpacing:"1.5px",
                    padding:"4px 12px",border:`1px solid rgba(201,133,122,0.25)`,
                    borderRadius:"22px",color:MUTED,fontFamily:SANS}}>{selStyle}</span>
                  <span style={{fontSize:"9px",letterSpacing:"1.5px",
                    padding:"4px 12px",border:`1px solid rgba(201,133,122,0.25)`,
                    borderRadius:"22px",color:MUTED,fontFamily:SANS}}>♪ {selMusic}</span>
                </div>
              </div>
            </div>
            {/* Tier picker */}
            <div style={{marginBottom:"26px"}}>
              <div style={{fontSize:"9px",letterSpacing:"3px",color:RG,
                marginBottom:"16px",fontFamily:SANS}}>{t.tierLabel.toUpperCase()}</div>
              <div style={{display:"flex",gap:"8px",justifyContent:"center",flexWrap:"wrap"}}>
                {TIERS.map((tier,i)=>(
                  <div key={tier.price} onClick={()=>setSelTier(i)}
                    style={{padding:"10px 12px",
                      border:`1px solid ${selTier===i?"rgba(201,133,122,0.7)":"rgba(250,240,236,0.1)"}`,
                      borderRadius:"8px",
                      background:selTier===i?"rgba(201,133,122,0.12)":"transparent",
                      cursor:"pointer",textAlign:"center",minWidth:"80px",
                      transition:"all 0.25s"}}>
                    <div style={{fontSize:"14px"}}>{tier.icon}</div>
                    <div style={{fontSize:"17px",
                      color:selTier===i?RGL:MUTED,fontWeight:"300",fontFamily:SERIF}}>{tier.price}</div>
                    <div style={{fontSize:"8px",letterSpacing:"1px",
                      color:selTier===i?RG:MUTED,fontFamily:SANS}}>{tier.name}</div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{display:"flex",gap:"10px",justifyContent:"center",marginBottom:"16px"}}>
              {btn(t.back,()=>setStep(3),false,false)}
              <button style={{background:`linear-gradient(135deg,${RG},${RGL})`,
                border:"none",color:NAVY,padding:"14px 40px",fontSize:"11px",
                letterSpacing:"3px",cursor:"pointer",fontWeight:"600",
                borderRadius:"3px",fontFamily:SANS,
                boxShadow:`0 6px 28px rgba(201,133,122,0.45)`}}>
                {t.sendBtn.toUpperCase()} ✦
              </button>
            </div>
            <p style={{fontSize:"11px",color:MUTED,fontFamily:SANS}}>{t.sendNote}</p>
          </div>
        )}
      </div>

      {/* ══ FEATURED ══ */}
      <div style={{padding:"88px 5%"}}>
        <div style={{textAlign:"center",marginBottom:"52px"}}>
          <div style={{fontSize:"9px",letterSpacing:"5px",color:RG,
            marginBottom:"14px",fontFamily:SANS}}>{t.featuredPill.toUpperCase()}</div>
          <h2 style={{fontSize:"clamp(26px,4vw,50px)",fontWeight:"300",
            margin:0,fontFamily:SERIF,color:CREAM}}>{t.featuredTitle}</h2>
        </div>
        <div style={{display:"grid",
          gridTemplateColumns:"repeat(auto-fill,minmax(265px,1fr))",gap:"22px"}}>
          {GIFTS.map((gift,i)=>(
            <div key={gift.title}
              onMouseEnter={()=>setHoveredGift(i)}
              onMouseLeave={()=>setHoveredGift(null)}
              style={{borderRadius:"12px",overflow:"hidden",
                border:`1px solid ${hoveredGift===i?gift.dearly?GOLD:RG:"rgba(201,133,122,0.14)"}`,
                transition:"all 0.35s",
                transform:hoveredGift===i?"translateY(-7px)":"none",
                boxShadow:hoveredGift===i
                  ?`0 24px 64px rgba(0,0,0,0.6),0 0 32px ${gift.glow}`
                  :"0 4px 24px rgba(0,0,0,0.4)",
                cursor:"pointer",background:NAVY3}}>
              <div style={{height:"200px",background:gift.bg,
                display:"flex",flexDirection:"column",
                alignItems:"center",justifyContent:"center",position:"relative"}}>
                <div style={{position:"absolute",top:"50%",left:"50%",
                  transform:"translate(-50%,-50%)",width:"160px",height:"160px",
                  background:`radial-gradient(circle,${gift.glow},transparent 70%)`,
                  borderRadius:"50%"}}/>
                <div style={{fontSize:"40px",marginBottom:"10px",position:"relative"}}>{gift.icon}</div>
                <div style={{width:"44px",height:"44px",borderRadius:"50%",
                  border:"1.5px solid rgba(250,240,236,0.22)",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:"14px",background:"rgba(0,0,0,0.3)"}}>▶</div>
                <div style={{position:"absolute",top:"12px",left:"12px"}}>
                  <span style={{fontSize:"8px",letterSpacing:"2px",
                    padding:"4px 10px",
                    background:gift.dearly
                      ?`linear-gradient(135deg,${GOLD},#E8C97A)`
                      :`linear-gradient(135deg,${RG},${RGL})`,
                    color:NAVY,fontWeight:"600",borderRadius:"3px",fontFamily:SANS}}>
                    {gift.badge.toUpperCase()}
                  </span>
                </div>
                <div style={{position:"absolute",bottom:"10px",right:"12px",
                  fontSize:"9px",color:"rgba(250,240,236,0.4)",
                  letterSpacing:"1.5px",fontFamily:SANS}}>30–45s · HD</div>
                {gift.dearly&&<div style={{position:"absolute",top:"12px",right:"12px",
                  fontSize:"9px",color:GOLD,letterSpacing:"1px",fontFamily:SANS}}>✦</div>}
              </div>
              <div style={{padding:"22px"}}>
                <div style={{fontSize:"9px",letterSpacing:"3px",
                  color:gift.dearly?GOLD:RG,marginBottom:"8px",fontFamily:SANS}}>
                  {gift.category.toUpperCase()}
                </div>
                <div style={{fontSize:"18px",fontWeight:"300",
                  marginBottom:"8px",color:CREAM,fontFamily:SERIF}}>{gift.title}</div>
                <div style={{fontSize:"12px",color:MUTED,lineHeight:"1.8",
                  marginBottom:"20px",fontFamily:SANS}}>{gift.desc}</div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:"22px",
                    color:gift.dearly?GOLD:RGL,fontWeight:"300",fontFamily:SERIF}}>{gift.price}</span>
                  <button style={{background:"transparent",
                    border:`1px solid ${gift.dearly?"rgba(201,168,76,0.4)":"rgba(201,133,122,0.38)"}`,
                    color:gift.dearly?GOLD:RGL,padding:"8px 18px",
                    fontSize:"10px",letterSpacing:"2px",cursor:"pointer",
                    borderRadius:"3px",fontFamily:SANS,transition:"all 0.25s"}}
                    onMouseEnter={e=>{e.currentTarget.style.background=gift.dearly?GOLD:RG;e.currentTarget.style.color=NAVY;}}
                    onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=gift.dearly?GOLD:RGL;}}>
                    SEND NOW
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* ══ CATEGORIES ══ */}
      <div style={{padding:"60px 5% 88px",background:NAVY2}}>
        <div style={{textAlign:"center",marginBottom:"52px"}}>
          <div style={{fontSize:"9px",letterSpacing:"5px",color:RG,
            marginBottom:"14px",fontFamily:SANS}}>{t.catPill.toUpperCase()}</div>
          <h2 style={{fontSize:"clamp(24px,3.5vw,46px)",fontWeight:"300",
            margin:0,fontFamily:SERIF,color:CREAM}}>{t.catTitle}</h2>
        </div>
        <div style={{display:"grid",
          gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:"12px"}}>
          {CATEGORIES.map(cat=>{
            const active=activeCat===cat.name;
            return (
              <div key={cat.name}
                onClick={()=>setActiveCat(active?null:cat.name)}
                style={{padding:"22px 14px",borderRadius:"8px",textAlign:"center",
                  cursor:"pointer",
                  border:`1px solid ${active?cat.special?GOLD:RG:cat.special?GOLDBDR:"rgba(250,240,236,0.07)"}`,
                  background:active
                    ?cat.special?"rgba(201,168,76,0.09)":"rgba(201,133,122,0.09)"
                    :cat.special?"rgba(201,168,76,0.03)":"rgba(255,255,255,0.02)",
                  transition:"all 0.28s",
                  boxShadow:active?cat.special?`0 0 20px rgba(201,168,76,0.18)`:`0 0 20px rgba(201,133,122,0.18)`:"none",
                  transform:active?"scale(1.04)":"scale(1)"}}>
                <div style={{fontSize:"26px",marginBottom:"9px"}}>{cat.emoji}</div>
                <div style={{fontSize:"12px",marginBottom:"5px",
                  color:cat.special?GOLD:CREAM,fontFamily:SANS}}>{cat.name}</div>
                <div style={{fontSize:"9px",
                  color:cat.special?GOLD:RG,letterSpacing:"1px",fontFamily:SANS}}>
                  {cat.count} blooms
                </div>
                {cat.special&&<div style={{fontSize:"8px",color:GOLD,
                  letterSpacing:"1.5px",marginTop:"5px",fontFamily:SANS}}>✦ SPECIAL</div>}
              </div>
            );
          })}
        </div>
      </div>

      {/* ══ PRICING ══ */}
      <div style={{padding:"88px 5%",textAlign:"center"}}>
        <div style={{fontSize:"9px",letterSpacing:"5px",color:RG,
          marginBottom:"16px",fontFamily:SANS}}>{t.pricingPill.toUpperCase()}</div>
        <h2 style={{fontSize:"clamp(24px,3.5vw,46px)",fontWeight:"300",
          margin:"0 0 52px",fontFamily:SERIF,color:CREAM}}>{t.pricingTitle}</h2>
        <div style={{display:"flex",justifyContent:"center",
          gap:"clamp(8px,1.5vw,16px)",flexWrap:"wrap",maxWidth:"880px",margin:"0 auto"}}>
          {TIERS.map((tier,i)=>(
            <div key={tier.price}
              style={{padding:"32px 20px",minWidth:"152px",flex:1,
                border:`1px solid ${i===2?RG:BORDER}`,borderRadius:"12px",
                background:i===2?"rgba(201,133,122,0.07)":"rgba(255,255,255,0.02)",
                boxShadow:i===2?`0 0 32px rgba(201,133,122,0.2)`:"none",
                position:"relative"}}>
              {i===2&&<div style={{position:"absolute",top:"-12px",left:"50%",
                transform:"translateX(-50%)",
                background:`linear-gradient(135deg,${RG},${RGL})`,
                color:NAVY,fontSize:"8px",letterSpacing:"2px",
                padding:"4px 14px",borderRadius:"14px",fontWeight:"600",
                whiteSpace:"nowrap",fontFamily:SANS}}>MOST LOVED</div>}
              <div style={{fontSize:"28px",marginBottom:"10px"}}>{tier.icon}</div>
              <div style={{fontSize:"28px",color:i===2?RGL:CREAM,
                fontWeight:"300",marginBottom:"5px",fontFamily:SERIF}}>{tier.price}</div>
              <div style={{fontSize:"13px",letterSpacing:"1px",
                marginBottom:"8px",color:i===2?CREAM:MUTED,fontFamily:SANS}}>{tier.name}</div>
              <div style={{fontSize:"11px",color:MUTED,lineHeight:"1.65",fontFamily:SANS}}>{tier.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ══ HOW IT WORKS ══ */}
      <div style={{padding:"80px 5%",borderTop:`1px solid ${BORDER}`,background:NAVY2}}>
        <div style={{textAlign:"center",marginBottom:"56px"}}>
          <div style={{fontSize:"9px",letterSpacing:"5px",color:RG,
            marginBottom:"14px",fontFamily:SANS}}>{t.howPill.toUpperCase()}</div>
          <h2 style={{fontSize:"clamp(24px,4vw,48px)",fontWeight:"300",
            margin:0,fontFamily:SERIF,color:CREAM}}>{t.howTitle}</h2>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",justifyContent:"center",
          maxWidth:"980px",margin:"0 auto",gap:"24px"}}>
          {t.howSteps.map((item,i)=>(
            <div key={i} style={{flex:"1",minWidth:"210px",textAlign:"center",padding:"0 20px"}}>
              <div style={{fontSize:"48px",fontWeight:"100",
                color:"rgba(201,133,122,0.15)",letterSpacing:"4px",
                marginBottom:"4px",fontFamily:SERIF}}>0{i+1}</div>
              <div style={{fontSize:"26px",marginBottom:"12px"}}>
                {["🌸","💌","🎵","✨"][i]}
              </div>
              <div style={{fontSize:"14px",letterSpacing:"1.5px",
                marginBottom:"10px",color:CREAM,fontFamily:SANS}}>{item.title}</div>
              <div style={{fontSize:"12px",color:MUTED,lineHeight:"1.85",fontFamily:SANS}}>{item.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ══ LANGUAGE BANNER ══ */}
      <div style={{margin:"0 5% 88px",padding:"52px 44px",
        background:`linear-gradient(135deg,rgba(13,24,40,0.8),rgba(201,133,122,0.06),rgba(13,24,40,0.8))`,
        border:`1px solid ${BORDER}`,borderRadius:"14px",
        display:"flex",alignItems:"center",justifyContent:"space-between",
        flexWrap:"wrap",gap:"32px"}}>
        <div>
          <div style={{fontSize:"9px",letterSpacing:"5px",color:RG,
            marginBottom:"16px",fontFamily:SANS}}>AVAILABLE EVERYWHERE</div>
          <h3 style={{fontSize:"28px",fontWeight:"300",margin:"0 0 12px",
            fontFamily:SERIF,color:CREAM}}>{t.langTitle}</h3>
          <p style={{color:MUTED,fontSize:"13px",lineHeight:"1.85",
            maxWidth:"380px",margin:"0 0 20px",fontFamily:SANS}}>{t.langSub}</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>
            {LANGS.map(l=>(
              <span key={l}
                onClick={()=>setLang(l)}
                style={{fontSize:"10px",letterSpacing:"1px",padding:"5px 13px",
                  border:`1px solid ${lang===l?RG:"rgba(201,133,122,0.22)"}`,
                  borderRadius:"24px",
                  color:lang===l?RGL:"rgba(250,240,236,0.55)",
                  cursor:"pointer",transition:"all 0.2s",
                  background:lang===l?"rgba(201,133,122,0.1)":"transparent",
                  fontFamily:SANS}}>
                {LANG_NAMES[l]}
              </span>
            ))}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
          <button style={{background:CREAM,border:"none",color:NAVY,
            padding:"14px 30px",fontSize:"11px",letterSpacing:"2px",
            cursor:"pointer",borderRadius:"6px",fontFamily:SANS,fontWeight:"600"}}>
            🍎 &nbsp;APP STORE
          </button>
          <button style={{background:"transparent",
            border:`1px solid rgba(250,240,236,0.25)`,
            color:"rgba(250,240,236,0.7)",padding:"14px 30px",fontSize:"11px",
            letterSpacing:"2px",cursor:"pointer",borderRadius:"6px",fontFamily:SANS}}>
            ▶ &nbsp;GOOGLE PLAY
          </button>
        </div>
      </div>

      {/* ══ FOOTER ══ */}
      <footer style={{borderTop:`1px solid ${BORDER}`,padding:"40px 5%",
        display:"flex",justifyContent:"space-between",alignItems:"center",
        flexWrap:"wrap",gap:"20px",background:NAVY}}>
        <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            <div style={{width:"24px",height:"24px",borderRadius:"50%",
              border:`1px solid ${RG}`,display:"flex",alignItems:"center",
              justifyContent:"center",fontSize:"12px"}}>🌸</div>
            <span style={{fontSize:"13px",letterSpacing:"3px",
              fontWeight:"400",color:CREAM,fontFamily:SANS}}>DIGITAL BLOOM</span>
          </div>
          <div style={{fontSize:"11px",color:RG,fontStyle:"italic",
            fontFamily:SERIF,paddingLeft:"34px"}}>{t.footerTag}</div>
          <div style={{fontSize:"10px",color:MUTED,fontFamily:SANS,
            paddingLeft:"34px",letterSpacing:"1px"}}>Home grown in Madison, AL ✦</div>
        </div>
        <div style={{fontSize:"10px",color:"rgba(250,240,236,0.2)",
          letterSpacing:"1px",fontFamily:SANS}}>
          © 2026 Digital Bloom · All rights reserved
        </div>
        <div style={{display:"flex",gap:"22px",fontSize:"10px",
          letterSpacing:"2px",color:"rgba(250,240,236,0.35)",fontFamily:SANS}}>
          {["PRIVACY","TERMS","CONTACT","CAREERS"].map(l=>(
            <span key={l} style={{cursor:"pointer",transition:"color 0.2s"}}
              onMouseEnter={e=>e.target.style.color=RG}
              onMouseLeave={e=>e.target.style.color="rgba(250,240,236,0.35)"}>
              {l}
            </span>
          ))}
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
