<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🌸 Digital Bloom — Prompt Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D1B36;--navy2:#0f2040;--navy3:#152240;
  --gold:#D4AF37;--gold2:rgba(212,175,55,0.15);--gold3:rgba(212,175,55,0.35);
  --white:#fff;--muted:rgba(255,255,255,0.45);--border:rgba(255,255,255,0.08);
  --green:#22c55e;--red:#ef4444;--purple:#818cf8;
  --card:rgba(255,255,255,0.04);
}
body{font-family:'Outfit',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased}

/* HEADER */
.header{background:rgba(13,27,54,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 20px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--gold);letter-spacing:0.04em;white-space:nowrap}
.header-stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:0.7rem;color:var(--muted);white-space:nowrap}
.pill span{color:var(--white);font-weight:700}
.pill.done span{color:var(--green)}

/* SEARCH + FILTER BAR */
.controls{padding:12px 20px;border-bottom:1px solid var(--border);background:rgba(13,27,54,0.85);position:sticky;top:61px;z-index:190;display:flex;flex-direction:column;gap:10px}
.search-wrap{position:relative}
.search{width:100%;padding:9px 36px 9px 14px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:10px;color:var(--white);font-size:0.85rem;font-family:'Outfit',sans-serif;outline:none;transition:border 0.2s}
.search:focus{border-color:var(--gold)}
.search::placeholder{color:var(--muted)}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:0.4;pointer-events:none;font-size:0.9rem}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:0.72rem;font-family:'Outfit',sans-serif;cursor:pointer;transition:all 0.2s;white-space:nowrap;flex-shrink:0}
.cat-btn:hover{border-color:var(--gold);color:var(--white)}
.cat-btn.active{background:var(--gold);color:#0D1B36;border-color:var(--gold);font-weight:700}

/* MAIN GRID */
.main{padding:16px 20px;max-width:1200px;margin:0 auto}
.section-label{font-family:'Playfair Display',serif;color:var(--gold);font-size:1rem;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);letter-spacing:0.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* PROMPT CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all 0.2s;display:flex;flex-direction:column}
.card:hover{border-color:var(--gold3);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.card.done{border-color:rgba(34,197,94,0.3);opacity:0.7}
.card.done:hover{opacity:1}
.card-header{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:10px}
.card-title{font-size:0.82rem;font-weight:600;color:var(--white);flex:1;line-height:1.4}
.card-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-size:0.7rem;margin-top:1px}
.card-check.checked{background:var(--green);border-color:var(--green);color:#fff}
.cat-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin:0 16px 10px;align-self:flex-start}

/* SCENES */
.scenes{padding:0 12px 12px}
.scene{margin-bottom:10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.scene-label{padding:6px 12px;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);background:rgba(212,175,55,0.08);border-bottom:1px solid var(--border)}
.scene-text{padding:10px 12px;font-size:0.75rem;color:rgba(255,255,255,0.75);line-height:1.65;max-height:100px;overflow:hidden;transition:max-height 0.3s}
.scene-text.expanded{max-height:600px}
.scene-actions{padding:6px 12px 10px;display:flex;gap:6px}
.btn-copy{padding:5px 12px;background:rgba(212,175,55,0.15);border:1px solid var(--gold3);border-radius:7px;color:var(--gold);font-size:0.7rem;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.2s;white-space:nowrap}
.btn-copy:hover{background:rgba(212,175,55,0.3)}
.btn-copy.copied{background:rgba(34,197,94,0.2);border-color:rgba(34,197,94,0.4);color:var(--green)}
.btn-expand{padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:0.7rem;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.2s}
.btn-expand:hover{border-color:var(--gold);color:var(--white)}

/* ITERATIONS (for mega-prompt format) */
.iteration{margin-bottom:8px}
.iter-label{font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--purple);margin-bottom:4px;padding:0 4px}

/* WORKFLOW NOTE */
.workflow-note{margin:0 12px 12px;padding:8px 12px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:8px;font-size:0.7rem;color:rgba(99,102,241,0.9);line-height:1.5}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:12px;display:block}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy2);border:1px solid var(--gold);color:var(--white);padding:10px 20px;border-radius:10px;font-size:0.82rem;z-index:9999;animation:fadeIn 0.3s;pointer-events:none;white-space:nowrap}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* UPLOAD ZONE */
.upload-zone{padding:0 12px 14px;display:flex;flex-direction:column;gap:6px}
.upload-live-badge{margin:0 12px 14px;padding:8px 14px;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);border-radius:10px;color:var(--green);font-size:0.75rem;font-weight:700;text-align:center}
.btn-upload{width:100%;padding:10px 0;background:rgba(212,175,55,0.08);border:1px dashed var(--gold3);border-radius:10px;color:var(--gold);font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.2s;text-align:center}
.btn-upload:hover{background:rgba(212,175,55,0.18);border-color:var(--gold)}
.btn-upload:disabled{opacity:0.45;cursor:not-allowed}
.upload-status{font-size:0.71rem;text-align:center;color:var(--muted);min-height:18px;transition:color 0.3s}
.upload-status.uploading{color:#93c5fd}
.upload-status.processing{color:var(--gold)}
.upload-status.live{color:var(--green);font-weight:700}
.upload-status.error{color:var(--red)}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

/* RESPONSIVE */
@media(max-width:600px){
  .header h1{font-size:1.05rem}
  .grid{grid-template-columns:1fr}
  .controls{top:53px}
}

/* CATEGORY COLORS */
.badge-mothers{background:rgba(255,182,193,0.2);color:#ffb6c1}
.badge-birthday{background:rgba(255,200,100,0.2);color:#ffc864}
.badge-love{background:rgba(220,80,80,0.2);color:#f87171}
.badge-friendship{background:rgba(100,220,180,0.2);color:#6edcb4}
.badge-thankyou{background:rgba(147,197,253,0.2);color:#93c5fd}
.badge-anniversary{background:rgba(212,175,55,0.2);color:#D4AF37}
.badge-encouragement{background:rgba(250,200,80,0.2);color:#fac850}
.badge-sympathy{background:rgba(200,200,220,0.2);color:#c8c8dc}
.badge-fathersday{background:rgba(100,150,220,0.2);color:#6496dc}
.badge-holiday{background:rgba(180,120,255,0.2);color:#b478ff}
.badge-zodiac{background:rgba(100,180,255,0.2);color:#64b4ff}
.badge-inclusive{background:rgba(255,140,200,0.2);color:#ff8cc8}
.badge-signature{background:rgba(212,175,55,0.2);color:#D4AF37}
</style>

// ═══════════════════════════════════════════════════
// APP LOGIC
// ═══════════════════════════════════════════════════

const DONE_KEY = 'db_prompt_done';
const LIVE_KEY = 'db_bloom_live';
function getDone(){try{return JSON.parse(localStorage.getItem(DONE_KEY)||'{}')}catch{return{}}}
function saveDone(d){localStorage.setItem(DONE_KEY,JSON.stringify(d))}
function getLive(){try{return JSON.parse(localStorage.getItem(LIVE_KEY)||'{}')}catch{return{}}}
function saveLive(l){localStorage.setItem(LIVE_KEY,JSON.stringify(l))}

const uploadStates = {}; // in-memory upload state so renders don't reset progress

let done = getDone();
let live = getLive();
let currentCat = 'All';
let searchQ = '';

const categories = ['All', ...new Set(PROMPTS.map(p=>p.cat))];

function init(){
  buildCats();
  render();
  document.getElementById('search').addEventListener('input', e=>{
    searchQ = e.target.value.toLowerCase();
    render();
  });
}

function buildCats(){
  const el = document.getElementById('cats');
  el.innerHTML = categories.map(c=>`
    <button class="cat-btn${c===currentCat?' active':''}" onclick="setcat('${c.replace(/'/g,"\\'")}')">
      ${catEmoji(c)} ${c}
    </button>`).join('');
}

function catEmoji(c){
  const m = {'All':'✨',"Mother's Day":'🌸','Birthday':'🎂','Love':'❤️','Friendship':'🤝',
    'Thank You':'🙏','Anniversary':'💍','Encouragement':'💪','Sympathy':'🕊️',
    "Father's Day":'👔','Holidays':'🎉','Zodiac / Celestial Saga':'⭐',
    'Inclusive & Special':'🌈','Signature Series':'✍️','Signature Stories':'📖',
    'Congratulations':'🏆','Grief':'🕊️','Luxury — Glass Stiletto':'💎',
    'Christmas':'🎄',"New Year's":'🥂',"Valentine's Day":'❤️',
    'Easter':'🌷','Thanksgiving':'🍂','Halloween':'🎃','4th of July':'🎆',
    'Hanukkah':'🕎','Kwanzaa':'✊','Veterans Day':'🎖️','Labor Day':'💪',
    'Celebration':'🎊','Zodiac':'⭐'};
  return m[c]||'🌸';
}

function setcat(c){currentCat=c;buildCats();render()}

function render(){
  const filtered = PROMPTS.filter(p=>{
    const catOk = currentCat==='All' || p.cat===currentCat;
    const q = searchQ;
    const searchOk = !q || p.title.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q) ||
      p.scenes.some(s=>s.text.toLowerCase().includes(q));
    return catOk && searchOk;
  });

  const totalDone = Object.values(done).filter(Boolean).length;
  document.getElementById('stat-total').textContent = PROMPTS.length;
  document.getElementById('stat-done').textContent = totalDone;
  document.getElementById('stat-showing').textContent = filtered.length;

  if(!filtered.length){
    document.getElementById('grid').innerHTML = `<div class="empty"><span class="empty-icon">🔍</span>No prompts found</div>`;
    return;
  }

  // Group by category for section labels
  const groups = {};
  filtered.forEach(p=>{
    if(!groups[p.cat]) groups[p.cat]=[];
    groups[p.cat].push(p);
  });

  let html = '';
  Object.entries(groups).forEach(([cat, prompts])=>{
    if(currentCat==='All') html += `<div class="section-label" style="grid-column:1/-1">${catEmoji(cat)} ${cat}</div>`;
    prompts.forEach(p=> html += cardHTML(p));
  });

  document.getElementById('grid').innerHTML = html;
}

function cardHTML(p){
  const isDone = !!done[p.id];
  const isLive = !!live[p.id];
  const st = uploadStates[p.id];
  // Encode title/cat as URI components so ANY character (quotes, dashes, emoji) is safe
  // inside the onclick/onchange HTML attributes.
  const encTitle = encodeURIComponent(p.title);
  const encCat   = encodeURIComponent(p.cat);
  return `
  <div class="card${isDone?' done':''}" id="card-${p.id}">
    <div class="card-header">
      <div class="card-title">${p.title}</div>
      <div class="card-check${isDone?' checked':''}" onclick="toggleDone('${p.id}')" title="Mark as generated">
        ${isDone?'✓':''}
      </div>
    </div>
    <span class="cat-badge ${p.badge}">${p.cat}</span>
    ${p.workflow?`<div class="workflow-note">⚡ ${p.workflow}</div>`:''}
    <div class="scenes">
      ${p.scenes.map((s,i)=>sceneHTML(p.id,i,s)).join('')}
    </div>
    ${isLive
      ? `<div class="upload-live-badge">✅ Live on digitabloom.store</div>`
      : `<div class="upload-zone">
           <input type="file" accept="video/*" id="file-${p.id}"
             style="position:fixed;top:-999px;left:-999px;width:1px;height:1px;opacity:0"
             onchange="handleUpload('${p.id}','${encTitle}','${encCat}',this)">
           <button class="btn-upload" id="uploadbtn-${p.id}" ${st&&st!=='error'?'disabled':''} onclick="document.getElementById('file-${p.id}').click()">
             ${st==='uploading'?'⬆️ Uploading…':st==='processing'?'🔥 Processing…':'📤 Upload Bloom'}
           </button>
           <div class="upload-status ${st||''}" id="status-${p.id}">
             ${st==='uploading'?'Sending to server…':st==='processing'?'Watermarking & publishing…':st==='error'?'Upload failed — tap to retry':''}
           </div>
         </div>`
    }
  </div>`;
}

function sceneHTML(pid, idx, scene){
  const sid = `${pid}-${idx}`;
  return `
  <div class="scene">
    <div class="scene-label">${scene.label}</div>
    <div class="scene-text" id="txt-${sid}">${escapeHtml(scene.text)}</div>
    <div class="scene-actions">
      <button class="btn-copy" id="btn-${sid}" onclick="copyScene('${pid}','${idx}')">Copy</button>
      <button class="btn-expand" onclick="expand('${sid}')">Expand</button>
    </div>
  </div>`;
}

function escapeHtml(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyScene(pid, idx){
  const p = PROMPTS.find(x=>x.id===pid);
  if(!p) return;
  const text = p.scenes[parseInt(idx)].text;
  const sid = `${pid}-${idx}`;
  const btn = document.getElementById(`btn-${sid}`);
  navigator.clipboard.writeText(text).then(()=>{
    if(btn){btn.classList.add('copied');btn.textContent='Copied!';setTimeout(()=>{btn.classList.remove('copied');btn.textContent='Copy'},2000)}
    showToast('Copied to clipboard');
  }).catch(()=>{
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.top='-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    if(btn){btn.classList.add('copied');btn.textContent='Copied!';setTimeout(()=>{btn.classList.remove('copied');btn.textContent='Copy'},2000)}
    showToast('Copied to clipboard');
  });
}

function expand(sid){
  const el = document.getElementById(`txt-${sid}`);
  if(el) el.classList.toggle('expanded');
}

function toggleDone(pid){
  done[pid] = !done[pid];
  saveDone(done);
  render();
}

let toastTimer;
function showToast(msg){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(()=>t.remove(), 2000);
}

// ─── UPLOAD SYSTEM ──────────────────────────────────
const CATEGORY_SLUGS = {
  "Mother's Day":'mothers-day',"Birthday":'birthday',"Love":'love',
  "Friendship":'friendship',"Thank You":'thank-you',"Anniversary":'anniversary',
  "Encouragement":'encouragement',"Sympathy":'sympathy',"Father's Day":'fathers-day',
  "Holidays":'holiday',"Zodiac / Celestial Saga":'zodiac',
  "Inclusive & Special":'womens-day',"Signature Series":'mothers-day',
  "Signature Stories":'signature-stories',
  "Congratulations":'congratulations',"Grief":'grief',
  "Luxury — Glass Stiletto":'luxury',"Christmas":'christmas',
  "New Year's":'new-years',"Valentine's Day":'valentines-day',
  "Easter":'easter',"Thanksgiving":'thanksgiving',"Halloween":'halloween',
  "4th of July":'fourth-of-july',"Hanukkah":'hanukkah',"Kwanzaa":'kwanzaa',
  "Veterans Day":'veterans-day',"Labor Day":'labor-day',"Celebration":'celebration',
  // Signature Stories routes to mothers-day slug by default (multi-occasion)
  // Individual upload will use the title slug for product creation
};

function slugify(str){return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

function setUploadState(pid, state, statusText){
  uploadStates[pid] = state;
  const btn = document.getElementById(`uploadbtn-${pid}`);
  const status = document.getElementById(`status-${pid}`);
  if(!btn||!status) return;
  if(state==='uploading'){
    btn.disabled=true; btn.textContent='⬆️ Uploading…';
    status.className='upload-status uploading'; status.textContent='Sending to server…';
  } else if(state==='processing'){
    btn.disabled=true; btn.textContent='🔥 Processing…';
    status.className='upload-status processing'; status.textContent='Watermarking & publishing…';
  } else if(state==='error'){
    btn.disabled=false; btn.textContent='📤 Upload Bloom';
    status.className='upload-status error'; status.textContent='❌ '+(statusText||'Failed — tap to retry');
  }
}

async function handleUpload(pid, encTitle, encCat, input){
  const file = input.files[0];
  if(!file) return;
  input.value=''; // reset so same file can be re-selected on retry

  const title = decodeURIComponent(encTitle);
  const cat   = decodeURIComponent(encCat);
  const slug = slugify(title);
  setUploadState(pid, 'uploading');

  try {
    // 1. Get pre-signed upload URL
    const urlRes = await fetch('/api/get-upload-url',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slug}),
    });
    if(!urlRes.ok) throw new Error(`Server error ${urlRes.status}`);
    const {signedUrl, rawPath} = await urlRes.json();
    if(!signedUrl) throw new Error('No signed URL returned');

    // 2. Upload video directly to Supabase Storage
    const upRes = await fetch(signedUrl,{method:'PUT', headers:{'Content-Type':'video/mp4'}, body:file});
    if(!upRes.ok) throw new Error(`Upload failed (${upRes.status})`);

    // 3. Trigger watermark + product creation
    setUploadState(pid, 'processing');
    const processRes = await fetch('/api/process-bloom',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({rawPath, title, slug, category:cat}),
    });
    const result = await processRes.json();
    if(!processRes.ok || !result.success) throw new Error(result.error||'Processing failed');

    // 4. Mark as live
    live[pid]=true; saveLive(live);
    done[pid]=true; saveDone(done);
    delete uploadStates[pid];
    showToast('🌸 Bloom is live on digitabloom.store!');
    render();

  } catch(err){
    setUploadState(pid, 'error', err.message);
    console.error('[upload]', err.message);
  }
}

init();
</script>
