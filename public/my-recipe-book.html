  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recipes" />
  <link rel="apple-touch-icon" id="apple-icon" />
  <title>My Personal Recipe Book</title>
  <script>
    // Generates a beautiful navy + gold home screen icon
    (function() {
      const SIZE = 180;
      const c = document.createElement('canvas');
      c.width = c.height = SIZE;
      const ctx = c.getContext('2d');

      // ── Background: deep navy gradient ──
      const bg = ctx.createLinearGradient(0, 0, SIZE, SIZE);
      bg.addColorStop(0, '#0D1B36');
      bg.addColorStop(1, '#162947');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, SIZE, SIZE);

      // ── Outer gold border ──
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 3;
      ctx.strokeRect(10, 10, SIZE - 20, SIZE - 20);

      // ── Inner gold border (double-line effect) ──
      ctx.strokeStyle = 'rgba(212,175,55,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(15, 15, SIZE - 30, SIZE - 30);

      // ── Corner flourishes ──
      const corners = [[18,18],[SIZE-18,18],[18,SIZE-18],[SIZE-18,SIZE-18]];
      ctx.fillStyle = '#D4AF37';
      corners.forEach(([x,y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // ── Top ornament line ──
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(40, 52); ctx.lineTo(SIZE-40, 52); ctx.stroke();

      // ── Small diamond center of top line ──
      ctx.save();
      ctx.translate(SIZE/2, 52);
      ctx.rotate(Math.PI/4);
      ctx.fillStyle = '#D4AF37';
      ctx.fillRect(-5, -5, 10, 10);
      ctx.restore();

      // ── "MY" small caps text ──
      ctx.fillStyle = 'rgba(212,175,55,0.8)';
      ctx.font = '500 13px Georgia';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('MY', SIZE/2, 75);

      // ── "Recipes" main text ──
      ctx.fillStyle = '#D4AF37';
      ctx.font = 'italic bold 36px Georgia';
      ctx.textBaseline = 'middle';
      ctx.fillText('Recipes', SIZE/2, 105);

      // ── Bottom ornament line ──
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(40, 130); ctx.lineTo(SIZE-40, 130); ctx.stroke();

      // ── Small sprig dots below line ──
      [SIZE/2 - 14, SIZE/2, SIZE/2 + 14].forEach((x, i) => {
        ctx.beginPath();
        ctx.arc(x, 130, i === 1 ? 3 : 2, 0, Math.PI * 2);
        ctx.fillStyle = i === 1 ? '#D4AF37' : 'rgba(212,175,55,0.5)';
        ctx.fill();
      });

      // ── Set as apple-touch-icon ──
      document.getElementById('apple-icon').href = c.toDataURL('image/png');

      // ── Also set as favicon ──
      const fav = document.createElement('link');
      fav.rel = 'icon'; fav.type = 'image/png';
      fav.href = c.toDataURL('image/png');
      document.head.appendChild(fav);
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      background: #fdf6ee;
      color: #2c1a0e;
      min-height: 100vh;
    }

    /* ── HEADER ── */

      background: #5c2e00;
      color: #fdf6ee;
      padding: 20px 16px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .site-header h1 { font-size: 1.5rem; letter-spacing: 1px; }
    .site-header p  { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }

    /* ── BACK BUTTON ── */

      display: none;
      background: none;
      border: none;
      color: #fdf6ee;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 0 8px;
      text-align: left;
      width: 100%;
    }
    .back-btn::before { content: '← '; }

    /* ── METHOD FILTER BAR ── */

      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #f5ece0;
      border-bottom: 1px solid #e8c99a;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .method-filter::-webkit-scrollbar { display: none; }

    .method-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid #c8720a;
      background: #fff;
      color: #5c2e00;
      font-family: 'Georgia', serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .method-btn.active {
      background: #c8720a;
      color: #fff;
      font-weight: bold;
    }
    .method-btn.grill-btn.active {
      background: #6b3a1f;
      border-color: #6b3a1f;
    }

    /* ── HOME: RECIPE CARDS ── */
    #home-view { padding: 16px; }

    .recipe-card {
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(92,46,0,0.1);
      cursor: pointer;
      border-left: 5px solid #c8720a;
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .recipe-card:active { transform: scale(0.98); box-shadow: 0 1px 5px rgba(92,46,0,0.15); }
    .recipe-card.hidden { display: none; }

    /* Charcoal grill cards get a darker left border */
    .recipe-card.grill {
      border-left-color: #6b3a1f;
      background: linear-gradient(135deg, #fff 85%, #fff5ec);
    }

    .recipe-card .emoji { font-size: 2rem; margin-bottom: 8px; display: block; }
    .recipe-card h2 { font-size: 1.05rem; color: #5c2e00; line-height: 1.3; }
    .recipe-card .tag { font-size: 0.72rem; color: #9b6530; margin-top: 5px; font-style: italic; }

    /* Method badge on each card */
    .method-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-style: normal;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .method-badge.oven  { background: #fff3e0; color: #c8720a; border: 1px solid #f5c890; }
    .method-badge.grill { background: #3a1a06; color: #f5c890; border: 1px solid #6b3a1f; }

    /* ── RECIPE DETAIL VIEW ── */
    #recipe-view { display: none; }

    .recipe-title-bar {
      background: #7a3a00;
      color: #fdf6ee;
      padding: 16px;
      text-align: center;
    }
    .recipe-title-bar h2 { font-size: 1.15rem; line-height: 1.4; }

    /* ── GRILL TIP BOX ── */
    .grill-tip {
      background: #3a1a06;
      color: #f5c890;
      border-radius: 10px;
      padding: 14px 16px;
      margin: 16px 16px 0;
      font-size: 0.88rem;
      line-height: 1.6;
      border-left: 4px solid #e07b30;
    }
    .grill-tip strong { display: block; margin-bottom: 4px; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; color: #e07b30; }

    /* ── TABS ── */
    .tabs {
      display: flex;
      background: #f0e0cc;
      border-bottom: 2px solid #c8720a;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 4px;
      border: none;
      background: none;
      font-size: 0.9rem;
      font-family: 'Georgia', serif;
      color: #7a4010;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active {
      background: #fdf6ee;
      color: #5c2e00;
      font-weight: bold;
      border-bottom: 3px solid #c8720a;
      margin-bottom: -2px;
    }

    /* ── TAB PANELS ── */
    .tab-panel { display: none; padding: 16px; }
    .tab-panel.active { display: block; }

    /* Shopping List */
    .shop-section { margin-bottom: 20px; }
    .shop-section h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9b6530;
      border-bottom: 1px solid #e8c99a;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }
    .shop-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f5e8d5;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .shop-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-top: 2px;
      accent-color: #c8720a;
      cursor: pointer;
    }
    .shop-item label {
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
      transition: color 0.2s;
    }
    .shop-item.checked label {
      text-decoration: line-through;
      color: #b0906a;
    }

    .clear-btn {
      margin-top: 12px;
      background: none;
      border: 1px solid #c8720a;
      color: #c8720a;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'Georgia', serif;
    }

    /* Ingredients */
    .ing-group { margin-bottom: 18px; }
    .ing-group h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9b6530;
      border-bottom: 1px solid #e8c99a;
      padding-bottom: 4px;
      margin-bottom: 10px;
    }
    .ing-group ul { list-style: none; }
    .ing-group ul li {
      padding: 6px 0;
      font-size: 0.95rem;
      border-bottom: 1px solid #f5e8d5;
      padding-left: 14px;
      position: relative;
    }
    .ing-group ul li::before {
      content: '•';
      color: #c8720a;
      position: absolute;
      left: 0;
    }

    /* Instructions */
    .steps ol { list-style: none; counter-reset: step-counter; }
    .steps ol li {
      counter-increment: step-counter;
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: flex-start;
    }
    .steps ol li::before {
      content: counter(step-counter);
      background: #c8720a;
      color: white;
      font-size: 0.85rem;
      font-weight: bold;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .steps ol li span { font-size: 0.95rem; line-height: 1.6; }
    .steps .note {
      background: #fff3e0;
      border-left: 3px solid #c8720a;
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      font-style: italic;
      color: #5c2e00;
      margin-top: 12px;
    }
  </style>
</head>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let activeRecipe = null;
let activeTab = 'shopping';
let activeMethod = 'all';
let checkState = {};

// ─────────────────────────────────────────────
// METHOD FILTER
// ─────────────────────────────────────────────
function setMethod(m) {
  activeMethod = m;

  // update button styles
  document.querySelectorAll('.method-btn').forEach(btn => btn.classList.remove('active'));
  const methods = ['all','oven','grill'];
  document.querySelectorAll('.method-btn')[methods.indexOf(m)].classList.add('active');

  renderCards();
}

// ─────────────────────────────────────────────
// RENDER HOME CARDS
// ─────────────────────────────────────────────
function renderCards() {
  const container = document.getElementById('card-container');
  let html = '';
  let visible = 0;

  recipes.forEach((r, index) => {
    if (activeMethod !== 'all' && r.cookType !== activeMethod) return;
    visible++;
    const isGrill = r.cookType === 'grill';
    const badgeClass = isGrill ? 'method-badge grill' : 'method-badge oven';
    const badgeText = isGrill ? '🪵 Charcoal Grill' : '🔥 Oven / Air Fryer';
    const cardClass = isGrill ? 'recipe-card grill' : 'recipe-card';

    html += `<div class="${cardClass}" onclick="showRecipe(${index})">
      <span class="emoji">${r.emoji}</span>
      <h2>${r.title}</h2>
      <div class="tag">${r.cardTag}</div>
      <span class="${badgeClass}">${badgeText}</span>
    </div>`;
  });

  if (visible === 0) {
    html = `<div style="padding:32px 16px; text-align:center; color:#9b6530; font-style:italic;">No recipes in this category yet.</div>`;
  }

  container.innerHTML = html;

  // Update subtitle count
  const total = activeMethod === 'all' ? recipes.length : recipes.filter(r => r.cookType === activeMethod).length;
  document.getElementById('headerSub').textContent = total + ' recipe' + (total !== 1 ? 's' : '');
}

// ─────────────────────────────────────────────
// NAV
// ─────────────────────────────────────────────
function showHome() {
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('recipe-view').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('headerTitle').textContent = 'My Recipe Book';
  renderCards();
  activeRecipe = null;
}

function showRecipe(index) {
  activeRecipe = index;
  const r = recipes[index];

  document.getElementById('home-view').style.display = 'none';
  document.getElementById('recipe-view').style.display = 'block';
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('headerTitle').textContent = '';
  document.getElementById('headerSub').textContent = '';
  document.getElementById('recipeTitle').textContent = r.title;

  // Show or hide grill setup tip
  const setupBox = document.getElementById('grill-setup-box');
  if (r.grillSetup) {
    setupBox.innerHTML = `<div class="grill-tip"><strong>🪵 Charcoal Grill Setup</strong>${r.grillSetup}</div>`;
  } else {
    setupBox.innerHTML = '';
  }

  switchTab('shopping');
}

// ─────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;

  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['shopping','ingredients','instructions'][i] === tab);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

  const panel = document.getElementById('tab-' + tab);
  panel.classList.add('active');
  renderPanel(tab);
}

// ─────────────────────────────────────────────
// RENDER PANELS
// ─────────────────────────────────────────────
function renderPanel(tab) {
  const r = recipes[activeRecipe];

  if (tab === 'shopping') {
    let html = '';

    // Grill supplies section at the top if it's a grill recipe
    if (r.cookType === 'grill') {
      html += `<div style="background:#fff5ec; border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:0.82rem; color:#5c2e00; border:1px solid #e8c99a;">
        <strong style="display:block; margin-bottom:4px; color:#c8720a;">💡 Check the Grill Setup tip above before shopping</strong>
        Wood type and quantity is listed in the Grill Supplies section below.
      </div>`;
    }

    r.shopping.forEach((section, gi) => {
      html += `<div class="shop-section"><h3>${section.group}</h3>`;
      section.items.forEach((item, ii) => {
        const key = `${activeRecipe}-shop-${gi}-${ii}`;
        const checked = checkState[key] ? 'checked' : '';
        const cls = checkState[key] ? 'shop-item checked' : 'shop-item';
        html += `<div class="${cls}" id="wrap-${key}" onclick="toggleCheck('${key}')">
          <input type="checkbox" ${checked} onclick="event.stopPropagation(); toggleCheck('${key}')" />
          <label>${item}</label>
        </div>`;
      });
      html += '</div>';
    });
    html += `<button class="clear-btn" onclick="clearChecks()">Clear all checks</button>`;
    document.getElementById('tab-shopping').innerHTML = html;
  }

  else if (tab === 'ingredients') {
    let html = '';
    r.ingredients.forEach(section => {
      html += `<div class="ing-group"><h3>${section.group}</h3><ul>`;
      section.items.forEach(item => { html += `<li>${item}</li>`; });
      html += '</ul></div>';
    });
    document.getElementById('tab-ingredients').innerHTML = html;
  }

  else if (tab === 'instructions') {
    let html = '<div class="steps"><ol>';
    r.steps.forEach(step => { html += `<li><span>${step}</span></li>`; });
    html += '</ol>';
    if (r.note) html += `<div class="note">💡 ${r.note}</div>`;
    html += '</div>';
    document.getElementById('tab-instructions').innerHTML = html;
  }
}

// ─────────────────────────────────────────────
// CHECKBOXES
// ─────────────────────────────────────────────
function toggleCheck(key) {
  checkState[key] = !checkState[key];
  const wrap = document.getElementById('wrap-' + key);
  if (!wrap) return;
  wrap.classList.toggle('checked', checkState[key]);
  wrap.querySelector('input').checked = checkState[key];
}

function clearChecks() {
  Object.keys(checkState).forEach(k => {
    if (k.startsWith(activeRecipe + '-shop-')) checkState[k] = false;
  });
  renderPanel('shopping');
}

// Start on home
showHome();
</script>
