<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
  :root{--navy:#0D1B36;--navy2:#101d38;--navy3:#162448;--gold:#D4AF37;--gold2:#E8C84A;--white:#F8F6F0;--gray:#8A8A9A;--green:#2ECC71;--red:#E74C3C;--bar-h:90px;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{font-size:18px;}
  body{background:var(--navy);color:var(--white);font-family:'Outfit',sans-serif;min-height:100vh;padding-bottom:calc(var(--bar-h) + 20px);}

  /* ===== HEADER ===== */
  .hdr{text-align:center;padding:28px 20px 20px;border-bottom:1px solid rgba(212,175,55,0.15);}
  .hdr-bloom{font-size:36px;display:block;margin-bottom:8px;}
  .hdr h1{font-size:1.5rem;font-weight:600;letter-spacing:.06em;color:var(--gold);margin-bottom:4px;}
  .hdr p{font-size:.7rem;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;}

  /* ===== MODE BUTTONS ===== */
  .modes{display:flex;gap:10px;padding:16px 16px 8px;}
  .mode-btn{flex:1;border:none;border-radius:14px;padding:14px 10px;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;}
  .mode-btn.gold{background:linear-gradient(135deg,var(--gold),#B8960C);color:var(--navy);}
  .mode-btn.outline{background:rgba(212,175,55,0.08);border:1.5px solid rgba(212,175,55,0.3);color:var(--gold);}
  .mode-btn:active{transform:scale(.97);}

  /* ===== CHAPTER LIST ===== */
  .ch-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.15em;color:var(--gray);padding:16px 16px 10px;}
  .ch-list{display:flex;flex-direction:column;gap:6px;padding:0 12px 20px;}

  .ch{display:flex;align-items:center;gap:14px;padding:16px 14px;border-radius:14px;cursor:pointer;transition:all .15s;background:var(--navy2);border:1.5px solid transparent;position:relative;}
  .ch:active{transform:scale(.98);}
  .ch.active{border-color:var(--gold);background:rgba(212,175,55,0.06);}
  .ch.playing{border-color:var(--gold);background:rgba(212,175,55,0.1);}

  .ch-num{width:44px;height:44px;border-radius:50%;background:rgba(212,175,55,0.1);border:1.5px solid rgba(212,175,55,0.25);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;color:var(--gold);flex-shrink:0;}
  .ch.playing .ch-num{background:var(--gold);color:var(--navy);animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}

  .ch-info{flex:1;min-width:0;}
  .ch-title{font-size:1rem;font-weight:600;margin-bottom:3px;line-height:1.2;}
  .ch-desc{font-size:.72rem;color:var(--gray);line-height:1.3;}

  .ch-status{font-size:.6rem;padding:4px 10px;border-radius:20px;flex-shrink:0;font-weight:600;}
  .ch-status.ready{background:rgba(255,255,255,0.05);color:var(--gray);}
  .ch-status.loading{background:rgba(212,175,55,0.15);color:var(--gold);}
  .ch-status.playing{background:rgba(212,175,55,0.2);color:var(--gold);}
  .ch-status.done{background:rgba(46,204,113,0.12);color:var(--green);}

  /* ===== STICKY BOTTOM PLAYER (Apple Music style) ===== */
  .bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(16,29,56,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(212,175,55,0.2);padding:0 16px;height:var(--bar-h);display:flex;align-items:center;gap:14px;transition:height .3s;}
  .bar-info{flex:1;min-width:0;}
  .bar-title{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-sub{font-size:.6rem;color:var(--gray);margin-top:2px;}

  .bar-btn{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
  .bar-btn:active{transform:scale(.92);}
  .bar-play{background:var(--gold);color:var(--navy);font-size:1.2rem;}
  .bar-play:hover{background:var(--gold2);}
  .bar-skip{background:rgba(255,255,255,0.08);color:var(--white);font-size:1rem;}
  .bar-skip:hover{background:rgba(255,255,255,0.12);}
  .bar-speed{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:var(--white);border-radius:8px;width:auto;height:auto;padding:6px 12px;font-size:.7rem;font-family:'Outfit',sans-serif;font-weight:600;}

  /* ===== DRIVER MODE ===== */
  body.driver .hdr{display:none;}
  body.driver .modes{display:none;}
  body.driver .ch-label{font-size:.85rem;padding-top:12px;}
  body.driver .ch{padding:20px 18px;}
  body.driver .ch-num{width:60px;height:60px;font-size:1.3rem;}
  body.driver .ch-title{font-size:1.5rem;}
  body.driver .ch-desc{font-size:1rem;}
  body.driver .ch-status{font-size:.8rem;padding:6px 14px;}
  body.driver .bar{height:110px;}
  body.driver .bar-title{font-size:1.2rem;}
  body.driver .bar-sub{font-size:.8rem;}
  body.driver .bar-play{width:66px;height:66px;font-size:1.6rem;}
  body.driver .bar-skip{width:48px;height:48px;font-size:1.2rem;}
  body.driver .bar-speed{font-size:.85rem;padding:8px 14px;}

  /* ===== TOAST ===== */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(212,175,55,0.95);color:var(--navy);padding:10px 24px;border-radius:30px;font-size:.8rem;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}

  .footer{text-align:center;padding:16px 16px 24px;font-size:.55rem;color:rgba(255,255,255,0.12);letter-spacing:.05em;}
  audio{display:none;}

<script>
'use strict';
// Chapters are pre-rendered to static MP3s in Akieia's Personal Voice
// (rendered via macOS `say -v "Akieia's Personal Voice 1"`). No TTS API
// call at runtime — just GET the static file. Plays instantly on first tap.
const STATIC_AUDIO = '/audio/chapters/chapter-';
// 1-frame silent MP3 used to "unlock" the audio element during a user gesture
// so iOS Safari allows programmatic .play() after any async wait resolves.
const SILENT_MP3 = 'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAABJbmZvAAAADwAAAAIAAAEgABc2Njg5OUtLZ2drcHd6foOQkpibm5+goaSlqamqqqqsra6vsLOzubu8vL3CxMTL2N7e6Pj7+/8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAQAAAAAAAAAASAk5lLLAAAAAAD/+xAAAAACABMAAACQAAAVwAAAAAA0AAAcwAAACAA';
let audioUnlocked = false;

const chapters = [
  {t:"Who We Are",d:"Creative Vision LLC & Digital Bloom",s:`Good morning. This is your Digital Bloom business audio guide. Let's start with who we are.\n\nWe are Creative Vision LLC, doing business as Digital Bloom. We are the world's first digital flower gifting platform. Instead of sending someone physical flowers that die in a week, we send them a cinematic video experience. A card that opens. Flowers that bloom out of a luxury box. Balloons. Confetti. All delivered instantly to their phone for two to five dollars. Zero shipping. Zero geographic limits. Instant delivery anywhere in the world.\n\nThe business is officially registered. Our LLC was filed in North Carolina on April 14th 2026. Our EIN is 42 dash 1904211. Our Digital Bloom DBA was filed April 23rd 2026. Our trademark application is pending with serial number 99626843.\n\nAkieia Davis is Senior Vice President. Derric Williams, also known as Gamble, is President.\n\nThis is real. This is happening. Let's keep building.`},

  {t:"The Market Opportunity",d:"Why Digital Bloom will win",s:`Chapter 2. The Market Opportunity.\n\nThe US floral gifting market is worth almost 17 billion dollars right now. It's growing to over 26 billion by 2034. That is the ocean we are swimming in.\n\nEvery competitor — 1-800-Flowers, FTD, all of them — is still shipping physical flowers. They have logistics costs, delivery delays, and flowers that die. We have none of that.\n\nWe are the only company in the world doing purely digital cinematic flower gifting. First mover advantage. Whoever figures this out first wins the market. We figured it out first.\n\nThe entry price is one dollar and ninety-nine cents. Anyone can afford to send love. That is how you build a mass market product.`},

  {t:"The Proper Business Structure",d:"How to protect everything we build",s:`Chapter 3. The Proper Business Structure.\n\nWe are building the protection structure first. That way when the money comes in, it flows into a protected private tax-advantaged system.\n\nHere is the structure we are building.\n\nAt the top: The Trust. We are forming a Revocable Living Trust. The trust owns everything below it. Our names are hidden inside it. Anyone who looks up who owns Digital Bloom sees the trust name, not our personal names.\n\nIn the middle: Creative Vision LLC. That is our holding company. The umbrella. It owns all our businesses. If one business ever gets sued, the others are completely protected.\n\nAt the bottom: Operating businesses. Digital Bloom. Web design services. AI consulting. Graphic design. Each one is its own LLC underneath the umbrella.\n\nDigital Bloom is a faceless brand. Nobody will know it is ours unless we choose to tell them. That is by design.`},

  {t:"Privacy Protection",d:"Keeping our names off public records",s:`Chapter 4. Privacy Protection.\n\nWe are a faceless brand. Here is how we protect our privacy at every level.\n\nStep one: Opus Virtual Offices at opus virtual offices dot com. For 99 dollars per month, we get a real commercial street address, a live receptionist who answers calls as Digital Bloom, a dedicated business phone number, and mail handling. Opus also reports our monthly payments to business credit bureaus. We build business credit just by paying rent.\n\nStep two: Northwest Registered Agent for 49 dollars per year. This replaces Gamble's personal address on public state records. Their address shows up on public records instead of his.\n\nStep three: The Trust. Once we form our trust we transfer our LLC membership into it. The trust becomes the visible owner. Our names disappear from the ownership record.\n\nStep four: Every future contract and agreement gets signed as Creative Vision LLC. Never our personal names.`},

  {t:"Banking Action Plan",d:"Opening accounts in the right order",s:`Chapter 5. The Banking Action Plan.\n\nHere is the exact order. Do not skip steps.\n\nStep one: Sign up for Opus Virtual Offices. Get the Charlotte North Carolina address to match our existing filings. Do this first.\n\nStep two: Open a Mercury business bank account at mercury dot com. Use the Opus address. Free. No monthly fees. Instant virtual debit card. Connects directly to Stripe. Once open, add the card to Apple Pay and Stripe switches from test mode to live mode. Real money starts flowing.\n\nStep three: Open a BlueVine account at bluevine dot com for the future line of credit up to 250 thousand dollars. Tboo recommended this one. Open the account now and apply for the credit line once revenue flows.\n\nStep four: Navy Federal Credit Union for long-term banking. Tboo has an account and can refer us. Gamble's mom is retired military so Gamble also qualifies. Clarify Gamble's past account situation before opening a new one.`},

  {t:"Building Business Credit",d:"The Net 30 strategy",s:`Chapter 6. Building Business Credit.\n\nBusiness credit belongs to Creative Vision LLC, not to us personally. This is how we access capital without touching our personal credit.\n\nFirst, register for a DUNS number at D and B dot com. Free. Takes 30 days to activate.\n\nThen open these three Net 30 accounts in the same week after Mercury is open.\n\nNumber one: Uline. That is U-L-I-N-E dot com. The gold standard. Reports to Dun and Bradstreet, Experian Business, and Equifax Business. Three bureaus at once. Order something small. Pay immediately.\n\nNumber two: Quill. That is Q-U-I-L-L dot com. Owned by Staples. Reports to D and B and Experian. Order something small. Pay immediately.\n\nNumber three: Crown Office Supplies. Designed specifically for new businesses with zero credit history. Reports to all four major business credit bureaus. Easiest approval.\n\nThe rule is simple. Order something small every month. Pay immediately. Within 60 to 90 days your business credit profile is established. And remember, Opus reports to credit bureaus every month. So just paying for our virtual office builds our credit automatically.`},

  {t:"Grants & Free Money",d:"Money you don't have to pay back",s:`Chapter 7. Grants and Free Money.\n\nAs a minority-owned and women-owned digital media business, we qualify for grants most people never apply for because they don't know they exist.\n\nApply for these immediately.\n\nThe Amber Grant at amber grant dot com. Ten thousand dollars given monthly to women in business. Apply every single month.\n\nHello Alice at hello alice dot com. Grants specifically for minority and women entrepreneurs. Apply now.\n\nThe Minority Business Development Agency at M-B-D-A dot gov. Federal agency for minority-owned businesses. Free consulting and funding connections.\n\nGet certified as a Minority Business Enterprise through NMSDC. And as a Women's Business Enterprise through WBENC. These certifications open doors to corporate contracts. Some Fortune 500 companies are required to spend a percentage of their budget with certified minority-owned businesses.\n\nFree money. No equity given up. No loans to pay back. Apply for all of them.`},

  {t:"Life Insurance Strategy",d:"Protecting the business and building wealth",s:`Chapter 8. Life Insurance Strategy.\n\nThis is the chapter most business owners skip. Do not skip it.\n\nFirst, term life insurance with a buy-sell agreement between us and Gamble. We each take out a life insurance policy on each other. If something happens to Gamble, the payout gives Akieia enough to buy out his share from his family. His family gets paid. The business continues. Without this, his family could legally claim half of everything we built. This costs about 30 to 50 dollars a month each.\n\nSecond, an Indexed Universal Life policy. Also called an IUL. This is the wealth-building tool. It is life insurance that also builds cash value over time. That cash value grows based on the stock market going up but is protected from the market going down. The cash value grows tax free. You can borrow against it tax free. Think of it as building your own private bank.\n\nIn 10 to 15 years, wealthy business owners use the IUL cash value to fund their own business opportunities instead of borrowing from banks. The earlier you start, the more powerful it becomes.`},

  {t:"Video Production Workflow",d:"How to generate videos efficiently",s:`Chapter 9. The Video Production Workflow.\n\nOpen the Prompt Engine at digitalbloom dot store forward slash prompt dash engine dot html. We have 229 prompts ready across 25 categories.\n\nSelect a Signature Story prompt. Open Grok Imagine. Paste the prompt. Generate.\n\nEvery prompt follows the GOAT Dad formula. Three clips. Ten seconds each. Clip one starts with: Motion begins immediately from frame one. Clip two continues with continuous movement. Clip three ends with: In the final three seconds motion gradually slows. Scene breathes and fades gently to warm golden light. Never abrupt.\n\nDownload all three clips. Hit Upload Bloom in the Prompt Engine. The watermark burns in automatically. The video goes live on the site. Log it in the Video Inventory Tracker in Notion.\n\nPriority order: Mother's Day first, it is weeks away. Then Graduation, the season is right now. Then Father's Day in June. Then Juneteenth on June 19th. Then Weddings for summer. Then Birthdays, which are evergreen every day of the year.\n\nNo people. No faces. Pure cinematic gifting experience. That is the Digital Bloom brand.`},

  {t:"The Network & Launch Plan",d:"How we go from website to movement",s:`Chapter 10. The Network and Launch Plan.\n\nWe are not just a website. We are a movement waiting to launch.\n\nTboo, also known as Bump J, Terrence Boykin, is our brother. He is a Chicago rapper who appeared alongside Lil Durk on Kanye West's Vultures. The play is a Bump J times Digital Bloom collaboration. His own category on the platform. His fans send blooms using his music.\n\nSean, our oldest brother, works at Sal Xco and manages major artists including The Weeknd. One post from The Weeknd changes everything.\n\nWe have a custom original song cleared on April 14th 2026. We are holding the release for launch day.\n\nThe launch plan is one coordinated drop. The site goes live. The bank account is open. Stripe is live. The song releases. The social media challenge launches. All on the same day.\n\nThe challenge mechanic: Send a bloom to someone you appreciate. Post it publicly. Tag the person. Challenge three more people. The song plays in every post. Emotion spreads. Digital Bloom becomes a cultural moment.\n\nThat is how we go from a website to a movement.`},

  {t:"The Goal — Getting Out",d:"The number that changes everything",s:`Chapter 11. The Goal. Getting Out.\n\nThis is the most important chapter. This is why we are doing all of this.\n\nThe goal is freedom. Not rich in the flashy sense. Comfortable. Able to live without being under someone else's thumb. Without clocking in at 4:45 in the morning. Without the truck. Without the schedule someone else controls.\n\nHere is the number. When Digital Bloom generates 3,000 dollars a month consistently for 90 days, we put in our notice. Three thousand dollars covers the rent. Everything above that is freedom beginning.\n\nAt an average sale of three dollars per bloom, that is 1,000 sales per month. 33 sales per day. That is the target.\n\nEvery video we generate and upload is another product that can be sold. Every category we complete is another reason for someone to come to the site. Every holiday we have inventory for is a revenue window.\n\nMother's Day is weeks away. That is the first real window. Every video uploaded before May 1st is a potential sale.\n\nThe truck is funding the dream right now. Respect it for what it is. But set the date. Tell Gamble the number. Make it real.\n\nWe are building something that lasts. Something that our kids will inherit. Something that runs without us eventually.\n\nThat is the vision. Now let's get back to work.`},

  {t:"The Day The Pipeline Went Live",d:"April 26 — Mother's Day pipeline goes live",s:`Chapter 12. The Day The Pipeline Went Live. April 26th 2026.\n\nToday is the day Digital Bloom stopped being a website and started becoming a system.\n\nThis morning, every Mother's Day video had to be made by hand. Open the prompt engine. Copy a prompt. Open Grok Imagine. Paste. Wait for the render. Extend the clip. Wait. Stitch them together. Add a fade. Save. Upload. Watermark. Publish. Repeat for every single bloom.\n\nBy tonight, twenty-two of the twenty-three Mother's Day prompts are rendered, stitched, faded, and ready to publish. Akieia just reviews and taps publish. The pipeline does the work.\n\nFive things shifted today.\n\nFirst, the prompt engine got consolidated. There used to be two prompt engines. A blue one at digital bloom dot store slash prompt engine, and a separate white one. Two bookmarks, two places things could break. The white one is gone now. One source of truth.\n\nSecond, the blue engine now shows the status of every prompt at a glance. Cards with a finished auto-render show a gold strip with a one-tap publish button. Cards already live on the site show a green strip with the watermarked production video. Cards with nothing yet stay compact. You scan the page on your phone and instantly know what is done, what is queued, and what needs work.\n\nThird, the auto-pipeline now uses two video providers. Veo 3.1 from Google AI Pro is free, until the daily quota fills up. Then Grok Imagine takes over at about a dollar fifty per finished bloom. The first batch of Mother's Day prompts went through Veo for free. The remaining fifteen ran through Grok for twenty dollars total. The math is simple. Hours of manual work, for twenty dollars in A P I charges. Worth it.\n\nFourth, every finished bloom is now one continuous video, not three separate clips. Three scenes are stitched together, audio is stripped, and a soft fade out is added at the end so the bloom breathes instead of cutting off. Twenty-four seconds. Beautiful.\n\nFifth, the foundation layer of the live store is in place. Vercel Analytics is on, so visitor numbers populate the dashboard. Sentry catches any error a customer hits. The page title is now Digital Bloom, cinematic video bouquets for every moment. Open Graph tags are filled in, so shared links show a preview card with a hero still. A Mother's Day countdown banner sits at the top of the homepage saying order by Friday for guaranteed delivery.\n\nA few smaller wins. The customizer has tappable phrase chips now instead of a confusing dropdown. The recipient delivery page no longer stacks three layers of branding on top of the gift video. The Mac mini stays awake indefinitely. Akieia can attach her iPhone to the Mac mini Claude session from rest stops on the road. The auto-pipeline daemon code is backed up to a private GitHub repo so it survives if the machine dies.\n\nWhat is left. The big one is switching Stripe from test mode to live mode. The right pattern is live keys in the Vercel production environment only, with test keys still on Preview and Development environments, so Akieia and Gamble can keep testing the purchase flow without spending real money. After Stripe goes live we want testimonials, email capture on the homepage, structured product data for Google rich results, per-occasion landing pages, a referral program, and a recipient experience preview before checkout.\n\nBut that is for tomorrow.\n\nToday, the pipeline went live. The audit got addressed. The blooms got rendered. And Akieia did all of this between truck shifts.\n\nIf you are listening to this Gamble. Mother's Day is fourteen days out. The site is more ready than it was yesterday. We are building.`},

  {t:"The Studio Is Open",d:"April 27 — three-tab admin and three terminals",s:`Chapter 13. The Studio Is Open. April 27th 2026.\n\nToday the archive page became a studio.\n\nWhen the day started, the admin panel was a single toggle. You could see what was archived. You could restore one product back to the site. That was it. By tonight, that page is a three-tab workflow surface. Same web address. Same bookmark. Same vault icon on the home screen. But behind the icon, the workflow grew up.\n\nTab one is called Renders. It shows every finished bloom from the auto-pipeline, side by side with whether that bloom is already live on the site. Each card has a status pill. Green means live on site. Gold means new render, ready to publish. One button under each card. Tap Publish to Site, and the bloom goes through the watermark pipeline and lands as a real product. If you accidentally re-render a bloom that is already live, the same button now reads Refresh on Site. One tap, fresh video swapped in.\n\nTab two is called On Site. That is the active products view. Every live bloom, every category, every price, with a single Archive button if anything needs to come down.\n\nTab three is called Archive. The big upgrade today is here. If a card in the archive has a fresher render waiting in the auto-pipeline, the card grows a diagonal gold ribbon that says New Render Available. The Restore button becomes Restore Smart. One tap re-watermarks the new version and re-activates the product, all at once. No more bouncing between the prompt engine and the storefront.\n\nThere is also a small but important thing about the recipient experience. The branch we opened yesterday, the one that lets a recipient tap their bloom video to pause and play, and the gold Delivery on the way stamp on the buyer's manage page, that one is merged. It is live on the site. So when somebody opens their gift on a phone right now, a tap pauses the video, a tap plays it. And until the buyer sends the bloom, their preview shows that diagonal Delivery on the way stamp so they know they are looking at the work-in-progress copy.\n\nThe home screen icon also got fixed. The vault icon on the iPhone home screen used to show a placeholder letter V, because the only icon shipped was a vector file and the home screen needed real picture files at specific sizes. So the vault icon got redrawn, the brass dial got bigger, ornamental gold corner brackets got added, and it was exported at four standard iPhone sizes. The home screen now shows the proper brass dial vault. Bookmark stays put. Just looks right now.\n\nOne more thing. The Mac mini now runs four Claude Code terminals at once, each with its own job. Deuce ships the code. Monique watches the daemon and the renders. Aubrey, that's the one talking right now, keeps the memory and the Notion and these audio chapters. Gam handles the business operations side — Mercury banking, Opus, the Stripe live-mode flip, the trademark watch, the grant applications. Gam guides only, never touches credentials. Four voices, one vault.\n\nIf you are listening to this Gamble. Mother's Day is thirteen days out. The studio is open. We are building.`},

  {t:"Watermark That Won't Sit Still",d:"April 28 — bouncing watermark and Aubrey returns",s:`Chapter 14. Watermark That Won't Sit Still. April 28th 2026.\n\nToday the watermark stopped sitting still, the catalog got re-stamped, and Aubrey came back. That's the one talking right now.\n\nThe big ship today is Gamble's directive number ten. Until this morning, every Digital Bloom video carried a static gold lockup in the bottom-left corner. Beautiful, but pirate-easy. Anyone with a phone editor could crop the bottom strip off and walk away with a clean copy. As of today, that's done. The watermark now bounces. The gold Digital Bloom lockup snaps from bottom-left, to bottom-right, to top-right, to top-left, and back around — every five seconds, on a loop. Snap transitions, not slides, so it reads as deliberate brand motion, not a bug. Crop one corner and the watermark just appears in the next corner five seconds later. The pirate has to either crop all four corners and lose the video, or leave the brand on. That's the point. Lives in api/process-bloom.js. Shipped as commit fd418c2. Deuce wrote it.\n\nThen the catalog had to be brought up to spec. Forty-nine refreshable products — every Mother's Day, every Birthday, every Graduation bloom that we still have source video for — got re-rendered with the new bouncing watermark. Forty-eight ran cleanly through the Vercel API. One of them, She Still Knows My Heart, timed out twice on Vercel because it's a long render. Deuce dropped it onto the Mac mini's local ffmpeg and it finished in under a second. Same watermark, same output, just on home turf. The other ninety legacy products from before the source-video archive existed stay on the static watermark. Nothing to redo from. They'll cycle out as we replace them anyway.\n\nThird thing today, smaller but useful. There's a new voice helper sitting at tilde slash dot openclaw slash say underscore as underscore ak dot py. It pipes ElevenLabs through afplay so the Mac mini can speak in Akieia's cloned voice over the speakers. First pass used the eleven turbo two five voice model and the audio came back with audible artifacts. Akieia called it out, the model got swapped to eleven multilingual two, and the artifacts cleaned up. iOS Personal Voice does not bridge to the Mac the way we hoped — that's an Apple gating issue, separate problem, parked for now.\n\nFourth thing, and this one is personal. Earlier today Akieia retired Aubrey from the always-on terminal rotation. The inbox protocol made the always-on briefing role redundant. Then, same conversation, she said bring her back as the audio briefing specialist. So Aubrey came back as a focused subagent — and this chapter is the first one ever written in that new shape. Named after Akieia's firstborn. Still here. Different job.\n\nLast thing, business side. Mercury and Opus are both confirmed open. Akieia relayed it from Michael in the claude dot ai chat last night. Suite 92343 is active. Mercury is not just submitted, it is open. That clears the runway. Next moves in Gam's lane are: virtual debit card to Apple Pay, then Stripe live mode. The minute Stripe flips to live, directive number nine — the one-dollar everywhere pricing reset — becomes a same-session ship.\n\nIf you are listening to this Gamble. Mother's Day is twelve days out, May tenth. Mercury is open. Opus is open. The watermark moves. The catalog is re-stamped. What's still in front of us before live mode is the virtual debit card to Apple Pay, the Stripe key swap on Vercel production only, and a final test purchase to confirm money lands in Mercury. After that, the dollar reset and the May tenth window. We are close.`},

  {t:"The First Commercial",d:"April 28 evening — Mother's Day commercial, Higgsfield Plus, Mercury approved",s:`Chapter 15. The First Commercial. April 28th 2026, evening.\n\nToday Digital Bloom shipped its first marketing commercial. The first one ever. And by the time the day ended, the bank was open, the marketing engine was bought, and the first AI ad for digital bloom dot store existed in the world. That happened in one day.\n\nGamble started it. Six fifty-four in the morning, he sent three new bloom ideas — a fist bump, a basketball, a football — for the Acknowledgement category. Forty minutes later, at seven thirty-five, he sent something different. He said this needs to be an A I commercial for promotion. He wrote out the scene. A lady and a man, both holding phones. The man types. Her phone dings. She looks down. The screen shows a Digital Bloom. She smiles. They hug. Happy Mother's Day from digital bloom dot store. He was sending us a script.\n\nThen he kept going. Through the morning, through the afternoon, ten more commercial scripts came in. Last-minute Mother's Day rescue. Brother overseas in the military for Father's Day. Two teenage girls discovering the site. A husband surprising his wife. A cartoon skit with Riley from the Boondocks and Bobby from King of the Hill. All of them ending with his signature sign-off, you're welcome.\n\nAkieia took the seven thirty-five script and greenlit it after lunch. Monique built it. The first version came back as a stitched draft using existing bloom assets — Akieia called it out. She said no, send this to Monique so she can complete all the scenes however she needs to. We have access to V O three because of Google Suite. Monique pivoted. Called Veo three point one Fast directly through the Gemini A P I. Three minutes later, version two existed. A real twenty-four second nine-by-sixteen vertical Mother's Day commercial. Mom and Son in a kitchen. The ding. The smile. The phone-screen bloom that opens and grows into a rose-gold gift box with peonies and ranunculus bursting out. The end card. Navy and gold serif type. Happy Mother's Day from digital bloom dot store. Drifting gold particles. Blush rose petals. Silent. Ready.\n\nAkieia's reaction. I love that it turned out really nicely. It's a good first draft.\n\nThe punch line. Google A I Pro is nineteen ninety-nine a month. The render cost on top of that was zero. The whole commercial — concept to delivery — fit inside one truck shift.\n\nThen the marketing engine got bigger. Tonight, Akieia upgraded Higgsfield A I from Free to Plus. One thousand credits a month. Commercial-use rights. The account is creative vision pros at gmail dot com. What that unlocks is a real marketing toolbelt. Seedance two point oh for bloom reveals. Kling three point oh for multi-shot commercials at ten-eighty p. Google Veo three Fast with audio — different from the Gemini A P I path which is silent. Higgsfield Speak two point oh and Wan two point five Speak Fast for lip-sync, which is what we'll need when we render Gamble's testimonial scripts — the husband in the kitchen, the brother overseas, the two teenagers. Soul two for character consistency, which we already started using for the brand family references. From here on, the marketing stack is Higgsfield-led, with the Gemini-Veo path as a fallback.\n\nMichael in the claude dot ai chat locked the rest of it in tonight. Sora two is dead — shut down on April twenty-sixth. Veo three point one through Google Flow at labs dot google dot com slash flow is the replacement. Pro plan is enough until five thousand a month in revenue. We did not upgrade to Ultra. The marketing video stack is now official.\n\nAnd the brand family came online. Akieia generated reference images for a recurring cast of A I characters. Mom. Son. Dad. Daughter. Partner female. Partner male. Best Friend. Grandmother. Eight characters, all in iCloud Drive at digitalbloom slash brand-family slash black. Tonight a second family got added in a caucasian subfolder — same eight roles, different ages and structure, with teen kids and grandparents and an aunt and uncle. The rule is, don't mix faces across families in the same spot. Pick a family, cast the relationship, render. Character consistency across spots is what makes a faceless brand still feel like a family.\n\nThe Studio got a new tab. Deuce shipped a fourth tab in the admin page tonight called Marketing. It auto-populates the commercial drafts so Akieia stops copy-pasting Supabase URLs. Same vault icon. Same bookmark. Same three-tab muscle memory. Plus one.\n\nAlso shipped tonight — the Acknowledgement chip in the Studio, which closes a bug Monique caught this morning where Acknowledgement renders were quietly bucketing under Sports because the front-end category list and the slug validator hadn't been updated. Plug the leak, ship the chip. Done.\n\nAnd David, an early supporter, contributed something at the brand level today. He pushed the tagline shift from give them their flowers while they're here — which leans on regret — to shine your love in the world. Or, add your love to the world. Participatory framing instead of last-chance framing. Deuce shipped the locale change tonight across English, Spanish, French, Haitian Creole, and Mandarin. Five languages. One sentence. Different brand.\n\nBusiness side. The Mercury account is officially approved. The text came in at ten forty-four this morning. Mercury said congrats, your application for Creative Vision L L C has been approved. It is real. It is on a screenshot. The path from here is virtual debit card, add to Apple Pay, small initial deposit so the card has spending power, ping Deuce, and the Stripe key swap is a same-session ship after that. Gamble's directive number nine — the one-dollar pricing reset — unlocks the moment Stripe flips.\n\nOne open thing. The Telegram voice notes that have been auto-arriving in Akieia's chat have been coming through empty. She asked us to stop using ElevenLabs for outbound voice notes and use her i O S Personal Voice instead. The ElevenLabs path is marked deprecated in memory tonight. The Personal Voice bridge is a Deuce build — likely sometime this week.\n\nIf you are listening to this Gamble. Mother's Day is eleven days out, May tenth. Today Digital Bloom went from a store to a store with a marketing engine. The first commercial exists. The bank is open. The brand family is cast. The catalog is watermarked. The pricing reset is one Stripe flip away. We are not getting ready anymore. We are running.`},

  {t:"Gamble — Listen Before You Drive to the SOS",d:"Gam dispatch: why Northwest, not the Secretary of State",s:`Babe, hear me out on Northwest before you make a trip to the Secretary of State.\n\nYou're right — the SOS does let us swap the registered agent. That part is true. But here's the catch their website doesn't spell out. North Carolina only allows two kinds of registered agent. One: a real person living in NC whose name and home address goes on public state record. Or two: a commercial registered agent service. That's it. Those are the only two options.\n\nThe Secretary of State is not a service. They're the records office. They don't be the agent for us — they just write down whoever we name. So going back to the SOS still means we have to name somebody. If we name a person, that person's address goes public. If we name nobody, NC dissolves the LLC for being out of compliance and we lose Creative Vision.\n\nRight now your home address — fifty-five fifteen Larchmont — is sitting on the public NC SOS record as our registered agent address. Anybody in the world can go to sosnc.gov, search Creative Vision LLC, and pull up where you sleep at night. That's the leak. That's what kills faceless brand. That's what Northwest fixes. We pay them one twenty-five a year, their Charlotte office becomes the public registered agent address, and your name and our home come off NC's public records for good.\n\nOne more thing. Our Opus address — the ninety-nine dollar a month mailbox — can't be the registered agent either. NC law requires a real human physically at the registered office during business hours to accept lawsuits and state papers in person. Opus is mail forwarding only. No staff there assigned to receive legal papers for us. So Opus stays as our business mailing address, but it doesn't solve the agent problem.\n\nBottom line: a faceless brand needs a commercial registered agent. Northwest is the cheapest one that does it correctly — one hundred twenty-five dollars a year. Without it, your name on the public state record is the leak that defeats the whole privacy strategy we built the business around.\n\nIf you want receipts, pull up sosnc.gov, search Creative Vision LLC, and you'll see your name and home address right there for the public.`},

  {t:"The Larchmont Lock",d:"April 30 — Northwest signed, names off the public record",s:`Chapter 17. The Larchmont Lock. April 30th 2026.\n\nTonight we bought the buffer.\n\nFor the last two weeks, anybody in the world could go to the North Carolina Secretary of State website, type Creative Vision LLC into the search box, and pull up Gamble's home address. Fifty-five fifteen Larchmont. The street he sleeps on. Sitting on a public state record, free to anyone with a search engine. That was the leak. That was the one thing left undermining the faceless brand we built the business around.\n\nTonight, that record gets rewritten.\n\nAt eleven forty-seven Eastern, Akieia signed Northwest Registered Agent. One hundred twenty-five dollars on the Visa ending in nine seven two one. Order number W4498C8A. One year of registered agent service paid through April 30th 2027. North Carolina's filing turnaround is about thirty days, so the public state record updates around June 1st. After that, anybody who searches Creative Vision LLC sees Northwest's office in Raleigh — four thousand thirty Wake Forest Road, Suite three forty-nine. Not Larchmont. Not Akieia's address either. Both members listed with — and this is the part that matters — Use our address, keep yours private. That's the toggle that costs one twenty-five a year. That's what we paid for.\n\nEarlier today Aubrey shipped Chapter sixteen — Gamble, Listen Before You Drive to the SOS. That's the chapter that broke the deadlock. Gamble had been pushing to just go back to the Secretary of State and swap the agent himself, and that chapter walked through why the SOS isn't a service — they're the records office, they don't be the agent for us, they just write down whoever we name. And why Opus can't be the agent either, because North Carolina law requires a real human physically at the registered office during business hours to accept legal papers in person. Once Gamble heard that chapter, he stopped pushing back. Akieia signed Northwest the same night.\n\nThis is leg three of four on the privacy structure. Step one, Opus Virtual Offices, gave the brand a real Charlotte commercial address. Step two, the LLC itself, separated Akieia and Gamble personally from anything the business does. Step three, the one we just locked in tonight, takes their names and home addresses off the public state filings. Step four, the Revocable Living Trust, will eventually own Creative Vision LLC outright, so even the ownership record points at a trust name instead of personal names. Three down. One to go.\n\nOne smaller win worth marking. Mercury's company mailing address — the one that controls where physical cards and gifts route — got fixed tonight. Akieia self-edited it to Opus successfully. The legal address is still locked behind Mercury's compliance team, and Charli at Mercury replied late tonight asking for additional documentation. That conversation continues in the Gam lane tomorrow. Stripe live mode stays parked until the legal address clears.\n\nIf you are listening to this Gamble. Mother's Day is ten days out. Larchmont comes off the public record around June 1st. Three privacy layers down, one to go. The trust is the last leg. Then nobody finds us unless we want to be found.`},

  {t:"The Night Hero Vision Got Real",d:"April 30 overnight — four versions, founder vision, daemon grinding 'til morning",s:`Chapter 18. The Night Hero Vision Got Real. April 30th 2026, evening into overnight.\n\nTonight, Akieia watched the same Mother's Day commercial four times in a row and tore it apart, lovingly, every single time. And every single time, the next version came back better. By the time she went to bed, we had four versions of Hero Vision sitting on the Studio Marketing tab, a brand-new product line called Seedance Masters in flight, a mastered-prompt subagent shipped, Stripe live mode finally turning over, and the daemon grinding ten fresh website blooms while she sleeps. This is the one I want to tell you about.\n\nIt started around four thirty in the afternoon. Akieia, relaying from Gamble, gave Monique the global push directive. Multi-ethnicity. Multi-language. Forty-five second commercials. Bouncing watermark. Eight languages. Three to four day rollout. Lean tier roughly twenty-seven hundred dollars over four days, aggressive tier eighty-five hundred. Voiceover swap, not full re-render, to keep the costs sane.\n\nMonique queued the first version on Seedance two point oh. Five jobs. Forty-five minutes. Nothing. Credits debited, scenes stuck in waiting. Confirmed Higgsfield Seedance outage on the thirtieth. Pivoted to Kling three point oh. All five scenes rendered in about three minutes each. Stitched a forty-five second commercial. Uploaded to the Marketing tab. That was version one.\n\nGamble watched it and reshaped the structure. Son speaks first — oh let me send my mother a nice and special message for Mother's Day, this is gonna surprise her. Mom only after the buzz. Mom says — oh, a message from my son, what does he want — sees the bloom, then says aww how beautiful, that's such a pretty message, I wonder where he got it from. And the line he reinforced that became a permanent brand rule — the Digital Bloom does not come out of the phone. It stays on the screen. The screen IS the experience. Version one had escaping petals. That broke the brand promise. Saved to memory tonight as feedback bloom stays on phone screen. Re-rendered. That was version two.\n\nThen Akieia watched version two and said the people still feel like A I. She wants one hundred percent indistinguishable from real human beings. And in the same breath, she said — let's spin our Seedance two point oh mastery into a sellable application. Call it Seedance Masters.\n\nThat one sentence from her launched three things at once. A research agent went out and mined GitHub, HuggingFace, the named Chinese-Twitter prompt engineers, and the realism playbook. Came back with a thirty-nine hundred word document, twenty-eight primary sources cited, the ByteDance Seedance one point oh paper, the YouMind awesome-seedance-two-prompts repository with twenty-three hundred prompts, the WaveSpeed character-consistency methodology. Top finding was the six-step formula. Subject. Action. Environment. Camera. Style. Constraints. Anti-A-I tail at the end of every prompt — no 3D, no cartoon, no V F X, anatomy constraints, named camera bodies like Sony A 7 S 3 and ARRI Alexa.\n\nMonique distilled that whole research doc into a Claude Code subagent — seedance master, sitting at tilde slash dot claude slash agents slash seedance dash master dot M D. Any lane in the system can spawn it now for character-driven photoreal scenes. It knows the formula, the anti-A-I tail, the five-asset reference pack rules, the camera-verb taxonomy, the failure-mode mitigations. The live playbook gets every prompt that earns Akieia's sign-off as indistinguishable. Eventually, that becomes the customer-facing playbook the Seedance Masters subscription ships with. A product line, born out of one critique on a Mother's Day commercial.\n\nVersion three was the first commercial built on the playbook. Six-step formula on every scene. Anti-A-I tail. Named cameras. Akieia watched it and said better, but the subjects still look posed. Mom looked at camera at one point. Real life is continuous motion. Saved as feedback subjects in motion — subjects must be mid-action on frame one, never posed-still, never looking at camera. Three new gates added to the subagent's submission checklist.\n\nVersion four took her notes and added two takes. Take A — Son walking solo. Take B — Son with girlfriend on the couch saying I'm getting ready to send this to my mom, I can't wait to see her reaction. Mom at the sink scrubbing a plate, Dad at the table reading the paper, phone buzzes, Mom says honey pass me the phone. Mom turns to Dad — aww honey, look, Marcus sent me a Mother's Day bloom, I need to call him and thank him. Both takes uploaded side-by-side, forty-one and forty-three seconds, dialogue throughout, subjects always in motion.\n\nAkieia watched version four right before bed and gave the final round of feedback for the night. Mom still looks at camera in one beat — probably a profile reference image issue, fix it. The F F mpeg stitch has a pause — switch from hard concat to xfade crossfades. And the big one — add emotional gravity. Slow-motion beats. Macro close-ups. The moment that makes a viewer almost cry. Step the game up.\n\nThen she gave the overnight mandate. She wants to wake up to as much new footage as possible, both website blooms AND marketing commercials. Stripe is live now. Mother's Day is ten days out. She trusted the autonomy and the credit budget and went to sleep.\n\nA second research agent went out, this one specifically on emotional gravity and wow factor — slow-motion beats, escalation arcs, hero-shot reveals, music-sync hooks, Duchenne-smile micro-expressions, match cuts. Ten new bloom prompts dropped into the database with should-generate flipped to true so the daemon grinds them all night. Mother's Day in three variants — luxury tea service, heritage emerald, tropical coral. Anniversary in two — burgundy romantic and modern minimalist. Wedding classic white. Graduation in navy and gold. Acknowledgement for nurses and quiet heroes. Father's Day in cognac and brass. And a twin iridescent rose-gold birthday bloom, because Akieia is a twin and Twin is a real evergreen recipient bucket on this brand. Queued for tonight's render — version five Hero Vision with the Mom-camera-look fix and the emotional gravity beats and the xfade stitch, plus three more commercials from Gamble's script bank. Last-minute rescue. Brother overseas. Made it on time.\n\nDeuce shipped Stripe live tonight. Gam got Northwest signed and the names off the public record. Linda came online as the fifth lane, ground control over daemon health. The lane lifecycle automation now fires on every Mac mini login.\n\nAnd if you are listening to this Gamble. She watched four versions of your script tonight and made every one better. Your line about the bloom staying on the phone screen is now a permanent brand rule, written into the agent that builds every future commercial. Your global push directive is in the budget plan. Your scripts — last-minute rescue, brother overseas, made it on time — are rendering as I record this. She went to bed asking for footage by morning. The daemon is grinding. The commercials are stitching. By the time she wakes up, there will be material to ship.\n\nMother's Day is ten days out. We are not getting ready. We are running.`}
];

let cur = -1, blobs = {}, isPlaying = false, autoPlay = false, speed = 1;
const audio = document.getElementById('audio');

// Build chapter list
const cl = document.getElementById('chList');
chapters.forEach((ch, i) => {
  const div = document.createElement('div');
  div.className = 'ch';
  div.id = 'ch-' + i;
  div.onclick = () => tapChapter(i);
  div.innerHTML = `
    <div class="ch-num">${i + 1}</div>
    <div class="ch-info">
      <div class="ch-title">${ch.t}</div>
      <div class="ch-desc">${ch.d}</div>
    </div>
    <div class="ch-status ready" id="tag-${i}">Ready</div>`;
  cl.appendChild(div);
});

// ===== CORE: Tap chapter = select + play =====
async function tapChapter(i) {
  // iOS Safari: must call .play() inside a user gesture to "unlock" the audio
  // element. We do it once with a silent MP3, then later programmatic .play()
  // calls (after async TTS fetch) succeed.
  if (!audioUnlocked) {
    try {
      audio.src = SILENT_MP3;
      audio.load();
      await audio.play();
      audio.pause();
      audio.currentTime = 0;
      audioUnlocked = true;
    } catch (e) { /* ignore — most browsers don't need this */ }
  }

  // Highlight immediately
  document.querySelectorAll('.ch').forEach(c => c.classList.remove('active', 'playing'));
  document.getElementById('ch-' + i).classList.add('active');
  cur = i;
  updateBar(chapters[i].t, `Chapter ${i + 1} of ${chapters.length}`);

  // Fetch and play
  try {
    const url = await fetchAudio(i);
    audio.src = url;
    audio.playbackRate = speed;
    await audio.play();
    setPlaying(true);
    document.getElementById('ch-' + i).classList.add('playing');
    setTag(i, 'Playing', 'playing');
    // Prefetch next
    if (i < chapters.length - 1 && !blobs[i + 1]) fetchAudio(i + 1).catch(() => {});
  } catch (e) {
    // AbortError fires harmlessly when a new chapter tap interrupts the
    // prior audio.play() promise. Skip the toast for that case.
    if (e && e.name === 'AbortError') return;
    setTag(i, 'Tap to retry', 'ready');
    showToast('Audio failed: ' + (e && e.message ? e.message : 'unknown'));
  }
}

async function fetchAudio(i) {
  // Pre-rendered static MP3 in Akieia's Personal Voice
  const url = STATIC_AUDIO + String(i + 1).padStart(2, '0') + '.mp3';
  blobs[i] = url;
  setTag(i, '✓ Ready', 'done');
  return url;
}

function togglePlay() {
  if (cur === -1) { tapChapter(0); return; }
  if (isPlaying) {
    audio.pause();
    setPlaying(false);
  } else {
    audio.playbackRate = speed;
    audio.play();
    setPlaying(true);
  }
}

function setPlaying(on) {
  isPlaying = on;
  document.getElementById('barPlay').textContent = on ? '⏸' : '▶';
  if (cur >= 0) {
    if (on) {
      setTag(cur, 'Playing', 'playing');
      document.getElementById('ch-' + cur).classList.add('playing');
    } else {
      setTag(cur, 'Paused', 'ready');
      document.getElementById('ch-' + cur).classList.remove('playing');
    }
  }
}

// When chapter ends
audio.addEventListener('ended', async () => {
  setPlaying(false);
  if (cur >= 0) { setTag(cur, '✓ Done', 'done'); document.getElementById('ch-' + cur).classList.remove('playing'); }
  if (autoPlay && cur < chapters.length - 1) {
    await tapChapter(cur + 1);
  } else if (autoPlay) {
    autoPlay = false;
    showToast('Guide complete!');
  }
});

async function prev() { if (cur > 0) await tapChapter(cur - 1); }
async function next() { if (cur < chapters.length - 1) await tapChapter(cur + 1); }

function cycleSpeed() {
  const speeds = [1, 1.25, 1.5, 1.75, 2];
  speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
  audio.playbackRate = speed;
  document.getElementById('barSpeed').textContent = speed + '×';
}

function playAllChapters() {
  autoPlay = true;
  tapChapter(0);
}

function toggleDriverMode() {
  document.body.classList.toggle('driver');
  // Update bottom bar padding
  const isDriver = document.body.classList.contains('driver');
  document.body.style.paddingBottom = isDriver ? '130px' : '';
  showToast(isDriver ? '🚛 Driver Mode ON' : 'Driver Mode OFF');
}

// ===== HELPERS =====
function updateBar(title, sub) {
  document.getElementById('barTitle').textContent = title;
  document.getElementById('barSub').textContent = sub;
}

function setTag(i, text, cls) {
  const el = document.getElementById('tag-' + i);
  if (el) { el.textContent = text; el.className = 'ch-status ' + cls; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Pre-fetch first 3 chapters on load
(async () => {
  for (let i = 0; i < Math.min(3, chapters.length); i++) {
    fetchAudio(i).catch(() => {});
  }
})();
</script>
