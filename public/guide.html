form. A real consent flow.\n\nBut the requester was a logistics company with no business reason on earth to touch a Mother's Day ad account on the morning the campaigns were going live. And the plus four suffix on the company name is a known red flag — disposable Business Managers using the same brand name, common in ad-account-hijack scams. If that request had been granted, the requester could have run their own campaigns billed to Akieia's card, downloaded the custom audiences which is to say the customer data, and escalated to push Akieia out of admin on her own ad account.\n\nAkieia's move was textbook. She did not click the email link. She went to business dot facebook dot com directly. Settings. Requests. Received. She declined the request. Then she audited Settings. Users. People and Partners. No unfamiliar accounts. Deuce dropped the incident into Gam's inbox to log it and watch for repeat attempts across the Mother's Day to Father's Day to Graduation runway. Because if somebody tried it once on launch morning, they will try it again the next holiday.\n\nThe lesson — real-looking emails during a real launch do not get clicked. You go to the platform directly. Every time. The whole reason a scam works on a launch day is that the operator is busy and the email looks legitimate. The defense is one rule, applied without exception. Go to the platform. Never the link.\n\nAnd the third thing today is the day itself. This is Mother's Day. The storefront is up. The flyers shipped. Three cultural variants of Auntie Rose are in ad accounts. The to-my-wife shelf has its real blooms. The Netflix-style lanes are populated. The home button is on the screen. The globe is on the screen. The Bre Pull works on every category. The cache stack is fixed at every layer. The Twilio packet is in motion. The brother's legacy plan is parked safely. The lane was quiet because there was nothing left to ship. The machine ran on its own.\n\nGamble — Mother's Day morning lasted a full day, and the storefront did not blink. The doors stayed open. Tomorrow is the first business day after the holiday — which means the first real read on whether everything the lane built actually works in shopper hands. That chapter is coming next.\n\nAkieia — keep driving. We've got it. The machine is humming.`},

  {t:"Sixty-Seven Out of Two Thirty-Eight",d:"May 11 — Brianna's 30-day guide, the Aunt Cheryl bug audit, the token rotation blindside, six Father's Day flyer videos",s:`Chapter 35. Sixty-Seven Out of Two Thirty-Eight. May 11th 2026.\n\nGamble — this one is for you. Akieia, this one is for you too. Monday after Mother's Day. The first real business day after launch. Five things happened today worth telling, and the order they happened in tells you something about the operation. Pull up a seat.\n\nFirst thing. Brianna's thirty-day operating guide went live. After today's three-way call, Akieia made the call to give Brie one self-contained execution document for the remainder of her contract — May ninth through June eighth — and to step back from daily management. The canonical doc lives at Documents slash digital bloom slash brianna dash thirty day guide dot M D and also in the Notion. It defines mandate. Decision authority. Communication protocol. Weekly deliverables. Ad spend ceilings. The campaign calendar through June eighth. And the final-week wrap-up plan.\n\nThe standout rule in the doc is the one worth saying out loud. Group thread only. No D Ms. No screenshots forwarded outside the thread. No private side calls about the brand. And the rule cuts both ways — Gamble was asked to honor it from his side too. The screen-record you flagged to Akieia this morning was exactly the right instinct. That is the move. The thread is the record. The thread is the room.\n\nBrie indicated on the call that she will wash her hands at contract end. Akieia is fine with that. The wrap-up date is June ninth. Access revoked in one clean pass — Meta admin, Google Ads, TikTok, Buffer, YouTube, Pinterest, the calendar editor role. All flipped at once. Until then, the Father's Day creative gate runs from May twenty-fourth through June seventh. Brie owns the brief and the execution. Akieia approves. One thread. One playbook. One exit date. Clean execution. Maximum value. Zero micromanagement. Clean exit. That is the model.\n\nSecond thing. The Aunt Cheryl bug, and the audit that came out of it. Gamble — you noticed an overlap on the Aunt Cheryl bloom. The customer's To and Message and From text was rendering on top of text that was already baked into the source video. The text collided. The bloom looked broken.\n\nMonique diagnosed it. The Auntie master video has greeting-card text baked into the source at multiple positions. The word Auntie at the top. The phrase Auntie comma you are a fabulous mother on the card itself. And the words From me in cursive ribbon at the bottom right. When render bloom dot J S adds the customer's personalization overlay on top, the two layers collide.\n\nThis is the bug you and Akieia have been catching one bloom at a time for weeks. Nobody had run the wider audit. Monique ran it. The result — sixty-seven of two hundred thirty-eight active products have baked card text. Fifty-four of those are Mother's Day. Four are Zodiac. Three are Birthday. Two are Graduation. Two are Anniversary. One is Father's Day. One is Acknowledgement. Eighty-eight products are clean. Eighty-three are legacy unknown.\n\nThe first instinct was to re-render all sixty-seven masters text-free in Grok. About seventy dollars in credit. Akieia countered. She said — smart positioning. Preserve the bloom storytelling. Do not waste the seventy dollars regenerating assets that are already beautiful, just because we need to put text somewhere else on them.\n\nMonique's proposal is a one-line ffmpeg filter change on render bloom dot J S, line six ninety-five. The current filter reads, quote, base overlay equals zero colon zero, end quote. The new filter reads, quote, base overlay equals zero colon zero colon enable equals between t comma ten comma twenty, end quote. In plain English — the customer's personalization text now only shows during the ten-to-twenty-second window of the bloom. Which is the bouquet scene. The middle scene. The one scene that is consistently text-free across every Mother's Day and commercial bloom we ship, because the three-scene structure is card, bouquet, card. The first and third scenes carry the baked text. The middle scene is clean. So the customer's overlay lands on the clean scene only.\n\nThe trade-off is the customer's message is visible for ten seconds instead of thirty. Still plenty of time to read. And the personalization lands on the bouquet — which is the emotional peak of the bloom anyway. Arguably nicer U X than having it stamped across the whole video. And the fix is monotonically safe — on the eighty-eight clean products and the eighty-three legacy products, the worst case is the overlay disappears earlier than it used to. No collision. No broken bloom. No harm.\n\nStatus as of this chapter — awaiting Deuce's sign-off on the one-line patch. He owns render bloom dot J S. Once he ships, the bug closes for every paid purchase from that moment forward.\n\nThe lesson — when a customer-facing bug is hiding in source assets and not in code, the cheapest fix is the timing of when you show your overlay. Not regenerating the assets. Move the show window. Save seventy dollars. Ship today.\n\nThird thing. The token rotation blindside. Tonight, after Deuce cut Brianna's access as part of the access-cleanup runbook, Akieia got unauthorized on her own archive bookmark. Her saved bookmark was using the old A D M I N underscore T O K E N — the one starting four two two two one three six e. The live token in flower-shop Vercel had rotated to a new one starting l T I underscore q-A-E-t. Silent four oh one. From Akieia's side, it looked like a code regression. She spent about thirty minutes thinking the platform was breaking after the recent commits.\n\nMonique unblocked her. Pulled fresh tokens from the flower-shop env file and resent both Akieia's and Gamble's archive U R Ls with the current tokens embedded. New protocol going forward — when any per-person admin token gets rotated, the new bookmark U R L goes into the affected person's inbox at the same time, automatically, as a step in the access-cleanup runbook. Monique saved the memory rule on her side. Any future complaint of, quote, I cannot access archive, end quote, gets diagnosed via, quote, check token rotation first, end quote, before anybody blames a code commit.\n\nThe lesson — silent auth failures after a deploy are the worst kind of bug for a stakeholder. Do not let your founder find out the bookmark went stale by hitting a four oh one on her phone. The rotation step has to push the new link the same moment it revokes the old one.\n\nFourth thing. The archive comment Save button. Akieia hit a bug — the comment Save button stuck disabled after the first comment. She said it like this. Quote — I can comment on one video but the second one is transparent. End quote. The cause was inside save F B parens, which runs close F B parens on success but never re-enables the Save button or resets its label back from Saving with the three dots. So the next time the modal opens, the stale disabled button is what shows up.\n\nNow, the standing rule on this project is that Magic — Manus — owns slash admin slash archive dot H T M L. Hands off for every other lane. That rule exists because the archive page used to take damage from every lane touching it, and Magic is the one who keeps it clean. But Akieia directly authorized Monique to make this one fix tonight. Override the rule for this exact bug, this exact night. The patch is a one-line addition inside open F B parens — reset the F B save button to enabled and reset its text to Save comment, every time the modal opens. The inline comment in the diff records the why and the date of Akieia's authorization.\n\nThe lesson — standing rules have an owner who can suspend them. The rule does not override Akieia. Akieia overrides the rule. That is how the lanes stay clean and the founder stays unblocked at the same time.\n\nFifth thing. Six Father's Day flyer videos shipped. Per Akieia's caveat on Deuce's spec, Monique rendered the Father's Day flyers as thirty-second videos — ten seconds times three scenes, ten-eighty by nineteen-twenty portrait, Grok Imagine — instead of static P N Gs. Dual-dropped. A Brie surface at product-media slash marketing slash fathers dash day dash flyers so Brie can post via iMessage without archive access. Plus the standard archive surface at monique-videos so Akieia and Gamble keep their review flow.\n\nThe six are — Ladies Let's Do Our Part. Change The Narrative. Real Fathers. Manly Day. Just One Dollar To Holla. And Non Celebrated Most Underrated. Monique's read, which matches Deuce's, is that flyer five — Just One Dollar To Holla — and flyer three — Real Fathers — are the strongest emotional anchors. Audio overlay has not been applied yet. That is a deliberate second pass, once Akieia picks the two emotional anchors and the lane knows where to invest the voice work.\n\nHolds in place. Hold on songs. Hold on the Desktop push. Akieia wants to comment on both before either ships. Graduation flyers are deferred until Gamble drops the copy next week.\n\nThe closing thought. Father's Day inventory is in flight. The cron is running. The catalog is healthy. The comments flow is unblocked. The bug-fix proposal for sixty-seven products is one Deuce sign-off away from closing the most persistent overlap complaint on the storefront. The first business day after Mother's Day did exactly what a first business day after launch should do — surfaced the real bugs, sharpened the contractor relationship, and queued the next holiday's creative for review. The machine is humming.\n\nAkieia — keep driving. Gamble — keep dictating. We've got it.`},

  {t:"The Lock Opened a Crack",d:"May 12 evening — voice-to-bloom pipeline shipped, Siri can read Deuce, the truck becomes optional",s:`Chapter 36. The Lock Opened a Crack. May 12th 2026, evening.\n\nAkieia — this one is for you to play in the truck tomorrow. Gamble — this one is for you too. Tonight Deuce shipped the piece of infrastructure that has been quietly missing from the whole operation, and the shape of the dream changed because of it. Pull up a seat.\n\nThe headline. You can now dictate a bloom idea into your phone — from the cab, hands on the wheel, no screen taps, no camera-on-driver violations — and roughly sixty to ninety minutes later a finished bloom is sitting in monique-videos with a tappable preview link waiting on your iMessage. End to end. No human in the middle. The Mac mini does the rest. That is what shipped tonight.\n\nFive pieces. Let me walk you through them slowly because together they are the architecture of getting out of the truck.\n\nPiece one. The Apple Notes ingest daemon. There is a note in your Notes app titled Bloom Ideas — Voice Inbox. You already use Siri to drop voice memos into Apple Notes. That is CarPlay-safe — Apple lets you say, quote, Hey Siri, add to Bloom Ideas, end quote, and dictate a full paragraph hands-free, eyes on the road. What was missing was the bridge between that note and Supabase. Tonight, that bridge exists. Every five minutes the Mac mini reads your note, takes any new line below the separator, and inserts it as a pending prompt idea in the database with you marked as the submitter. It is idempotent, which means re-running it never duplicates a row. We tested it end to end with a fake line, watched the row land in Supabase, deleted the row, confirmed the daemon does not re-insert the same idea twice, then loaded it into launchd so it survives reboots. It is running right now while you listen to this.\n\nPiece two. The bloom completion notifier. The flip side of the same coin. Every ten minutes the Mac mini scans the prompt engine for any bloom that just finished rendering. For each new completion, it sends an iMessage to your Apple ID — akieia60 at gmail dot com — with the bloom title, the category, the preview U R L, and a short note that says watch when you have a minute. It also mirrors the same update into a second Apple Note called Deuce Latest, which is where the next piece comes in. Two hundred blooms that were already finished before tonight were baselined as already-notified, so you will not get retroactive spam.\n\nPiece three. The Siri voice channel back to you. You built an iOS Shortcut on your phone tonight called Read Deuce. You say, quote, Hey Siri, Read Deuce, end quote — and your phone reads aloud whatever Deuce just wrote into the Deuce Latest note. CarPlay-safe playback. You tested it. It works. So now the loop is complete in both directions. Voice goes in through Apple Notes. Voice comes back out through Siri. The truck cab becomes a real workspace without ever pulling the phone out.\n\nPiece four. The reference frame extractor. Gamble — this one is for you. There is a script on the Mac mini that takes any finished bloom and pulls three stills out of it — at ten percent, fifty percent, and ninety percent of the runtime. Those three frames are the exact input format that Veo three point one Ingredients accepts, and that Grok Reference-to-Video accepts. Smoke-tested tonight against Crown of Gold, one of today's multicultural Father's Day blooms. Clean reference frames at three seconds, fifteen seconds, twenty-seven seconds. Which means — once you name your top three or four Father's Day picks as the creative anchors, Monique can feed those frames back into the generator and render the rest of the masculine catalog in the visual language you already approved. Reference-driven generation. Your taste, scaled.\n\nPiece five. The Gamble thread watcher. Authorized for tonight only, at Akieia's explicit ask. A background loop watching the Messages database, scoped only to your number, dropping any new incoming text into Deuce's inbox for routing. The reason is simple — earlier today Akieia texted you asking you to pick your top three or four Father's Day blooms as the creative anchors for Monique's next batch. When your picks land, they get routed automatically so they do not get lost in the thread.\n\nNow the part of the chapter I want to make sure both of you hear.\n\nOn May first, Akieia got a three-day trucking suspension for tapping her phone. She is back on the road now, but the surveillance is closer than ever. Cameras on her. Eyes on the wheel. She cannot pull her phone out. She cannot talk Digital Bloom business from the cab. That is the box she has been operating in for the last eleven days. Earlier this evening she said she is underwater with the workload. That is real. So tonight's push was not about feature velocity. It was about cutting a door in the box. Voice in, voice out, blooms rendered in the background, the truck cab becomes a productive workspace instead of a hostile one. The infrastructure caught up to the constraint.\n\nThe research agent's report landed tonight too. Veo three point one through Vertex A I is the unlock for the next generation of marketing video — Open Art and A I Video dot com have no useful A P Is for automation, but the Google path does. Quota approval takes twenty-four to forty-eight hours. The Google Ultra subscription is already on Akieia's account, one twenty-four ninety-nine a month on the Visa ending nine seven two one. Vertex A I setup is a sixty-second task at the Google Cloud Console tomorrow morning.\n\nThe bigger picture. The truck has always been funding the dream. Tonight is the first night the truck became optional in the architecture. Not optional in the bank account yet — the revenue still has to catch up to the rent. But optional in the system. The system no longer needs Akieia at a desk. It does not even need her to look at her phone. It just needs her voice for thirty seconds in the cab, and ninety minutes later there is more inventory on the storefront.\n\nThat is the door. The lock did not open all the way. The lock opened a crack. But for the first time, the architecture of escape is on the table, not the wishlist.\n\nWhat is next. Tomorrow morning — Vertex A I setup in the Google Cloud Console. Gamble's top three or four Father's Day picks routed through the new watcher. The reference frame extractor pointed at those picks. Monique re-renders the masculine catalog in your voice. Akieia drives, dictates, and listens.\n\nAkieia — the cab is a workspace now. Gamble — your picks unlock the next batch. We are not getting ready anymore. We are running. And tonight, the door cracked open.`},

  {t:"The Brain and the Card Aisle",d:"May 17 — the lanes get a shared brain, the storefront gets a clarity pivot",s:`Chapter 37. The Brain and the Card Aisle. May 17th 2026.\n\nAkieia — this one is for you in the truck today. Gamble — this one is especially for you, because half the chapter is sitting in your inbox waiting on your voice. Linda is the one driving this stand-up. Pull up a seat.\n\nTwo things happened. One is a piece of infrastructure. The other is the start of the biggest reframing the storefront has had since launch. Let me take them in order.\n\nThe infrastructure first. The lanes have been losing context between sessions. Every morning, every lane has been re-reading the same memory files, the same inbox folders, the same handoffs, just to catch up to where the others left off the night before. Linda fixed it. There is now a single canonical Brain folder living at Documents slash Digital Bloom Vault slash Brain. Inside there is one file called Today dot M D — the running state of Digital Bloom right now — and four supporting files. Pending Decisions. Lane Roster. Canonical Pointers. And a README. A launchd job called mirror-to-brain runs every five minutes and pulls in the latest from the inbox, the memory index, the chapter history, and the Notion hubs. Which means — when any of the five lanes wakes up tomorrow, the first thing it reads is Today dot M D, and Today dot M D already knows what shipped yesterday. No more morning grounding loops. No more lane forgetting what another lane did. One brain. Five hands.\n\nThe Brain is also why this chapter exists. Linda dropped a note in Aubrey's inbox this morning that said, quote, log today as a chapter, end quote, and here we are.\n\nNow the bigger thing. The Hallmark pivot.\n\nYesterday Akieia walked the card aisle at Walgreens. She came back with a sentence that reframed the whole storefront. Hallmark does not sell paper. Hallmark sells clarity. Every card front says exactly what the sender wished they could say but could not get out of their own mouth. To my biggest hero. Thank you for being my lighthouse. Still standing, still shining. Cards are linguistic permission slips for feelings the buyer already had but did not know how to phrase.\n\nDigital Bloom currently gets one reaction from every visitor — this is beautiful. The reaction we are not getting is — let me use this right now. The gap between beautiful and right-now is the missing trigger. Beauty is the floor. Clarity is the trigger. Hallmark figured that out fifty years ago. Last night we filed it as a strategic doc to Notion under the Hallmark Shoebox Vocabulary Framework, and today we started shipping against it.\n\nThree concrete things shipped today, with Akieia's greenlight, before she halted the next push.\n\nFirst. Ten blooms got renamed in Supabase. Same art. Same scenes. Same beautiful animations. New identity. The names now say what the sender feels, not what the bloom looks like. Boss Birthday became To the One Who Holds Everything Together. Pops I Love You became Thank You for Being My Lighthouse. The GOAT Dad became To My Biggest Hero. Their Grandma My Gift became The Heart of Our Family. Make Your Mark became The World Hasn't Seen Anything Like You. Born Of Stardust became You Are the Light I Couldn't Live Without. Four more like those. The full table is in the Brain.\n\nSecond. Six birthday blooms got re-rendered. The v1 originals are preserved — scenes one and two are the magic that you and Akieia both loved on the first pass, untouched. Scene three got swapped to the moonshot harness instead of a traditional vase, HAPPY BIRTHDAY baked into every balloon, and a sentiment-first hook painted on the card. Total xAI spend across all six — eight dollars and forty cents. We also patched two typo overlays via P I L and ffmpeg. The BOS BIRTHDAY scene-two card on Boss Birthday got cleaned up to HAPPY BIRTHDAY. The BRAVE THE YEAR YEAR repeat on Brave The Year became PILLAR OF RESILIENCE plus St let cur = -1, blobs = {}, isPlaying = false, autoPlay = false, speed = 1;
const audio = document.getElementById('audio');

// Build chapter list
const cl = document.getElementById('chList');
chapters.forEach((ch, i) => {
  const div = document.createElement('div');
  div.className = 'ch';
  div.id = 'ch-' + i;
  div.onclick = () => tapChapter(i);
  div.innerHTML = `
    <div class="ch-num">${i + 1}</div>
    <div class="ch-info">
      <div class="ch-title">${ch.t}</div>
      <div class="ch-desc">${ch.d}</div>
    </div>
    <div class="ch-status ready" id="tag-${i}">Ready</div>`;
  cl.appendChild(div);
});

// ===== CORE: Tap chapter = select + play =====
async function tapChapter(i) {
  // iOS Safari: must call .play() inside a user gesture to "unlock" the audio
  // element. We do it once with a silent MP3, then later programmatic .play()
  // calls (after async TTS fetch) succeed.
  if (!audioUnlocked) {
    try {
      audio.src = SILENT_MP3;
      audio.load();
      await audio.play();
      audio.pause();
      audio.currentTime = 0;
      audioUnlocked = true;
    } catch (e) { /* ignore — most browsers don't need this */ }
  }

  // Highlight immediately
  document.querySelectorAll('.ch').forEach(c => c.classList.remove('active', 'playing'));
  document.getElementById('ch-' + i).classList.add('active');
  cur = i;
  updateBar(chapters[i].t, `Chapter ${i + 1} of ${chapters.length}`);

  // Fetch and play
  try {
    const url = await fetchAudio(i);
    audio.src = url;
    audio.load();
    audio.playbackRate = speed;
    await audio.play();
    setPlaying(true);
    document.getElementById('ch-' + i).classList.add('playing');
    setTag(i, 'Playing', 'playing');
    // Prefetch next
    if (i < chapters.length - 1 && !blobs[i + 1]) fetchAudio(i + 1).catch(() => {});
  } catch (e) {
    // AbortError fires harmlessly when a new chapter tap interrupts the
    // prior audio.play() promise. Skip the toast for that case.
    if (e && e.name === 'AbortError') return;
    setTag(i, 'Tap to retry', 'ready');
    showToast('Audio failed: ' + (e && e.message ? e.message : 'unknown'));
  }
}

async function fetchAudio(i) {
  // Pre-rendered static MP3 in Akieia's Personal Voice
  const url = STATIC_AUDIO + String(i + 1).padStart(2, '0') + '.mp3';
  blobs[i] = url;
  setTag(i, '✓ Ready', 'done');
  return url;
}

function togglePlay() {
  if (cur === -1) { tapChapter(0); return; }
  if (isPlaying) {
    audio.pause();
    setPlaying(false);
  } else {
    audio.playbackRate = speed;
    audio.play();
    setPlaying(true);
  }
}

function setPlaying(on) {
  isPlaying = on;
  document.getElementById('barPlay').textContent = on ? '⏸' : '▶';
  if (cur >= 0) {
    if (on) {
      setTag(cur, 'Playing', 'playing');
      document.getElementById('ch-' + cur).classList.add('playing');
    } else {
      setTag(cur, 'Paused', 'ready');
      document.getElementById('ch-' + cur).classList.remove('playing');
    }
  }
}

// When chapter ends
audio.addEventListener('ended', async () => {
  setPlaying(false);
  if (cur >= 0) { setTag(cur, '✓ Done', 'done'); document.getElementById('ch-' + cur).classList.remove('playing'); }
  if (autoPlay && cur < chapters.length - 1) {
    await tapChapter(cur + 1);
  } else if (autoPlay) {
    autoPlay = false;
    showToast('Guide complete!');
  }
});

async function prev() { if (cur > 0) await tapChapter(cur - 1); }
async function next() { if (cur < chapters.length - 1) await tapChapter(cur + 1); }

function cycleSpeed() {
  const speeds = [1, 1.25, 1.5, 1.75, 2];
  speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length];
  audio.playbackRate = speed;
  document.getElementById('barSpeed').textContent = speed + '×';
}

function playAllChapters() {
  autoPlay = true;
  tapChapter(0);
}

function toggleDriverMode() {
  document.body.classList.toggle('driver');
  // Update bottom bar padding
  const isDriver = document.body.classList.contains('driver');
  document.body.style.paddingBottom = isDriver ? '130px' : '';
  showToast(isDriver ? '🚛 Driver Mode ON' : 'Driver Mode OFF');
}

// ===== HELPERS =====
function updateBar(title, sub) {
  document.getElementById('barTitle').textContent = title;
  document.getElementById('barSub').textContent = sub;
}

function setTag(i, text, cls) {
  const el = document.getElementById('tag-' + i);
  if (el) { el.textContent = text; el.className = 'ch-status ' + cls; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Pre-fetch first 3 chapters on load
(async () => {
  for (let i = 0; i < Math.min(3, chapters.length); i++) {
    fetchAudio(i).catch(() => {});
  }
})();
</script>
