<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Bloom — Archive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0a0a0a; color:#e8e8e8; font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; min-height:100vh; padding-bottom:80px; }
  header { background:#111; border-bottom:2px solid #D4AF37; padding:18px 18px 14px; position:sticky; top:0; z-index:5; }
  header h1 { color:#D4AF37; font-size:1.05rem; letter-spacing:0.1em; text-transform:uppercase; }
  header p { color:#888; font-size:0.78rem; margin-top:4px; }
  .cat-tabs { display:flex; gap:8px; padding:12px 14px; overflow-x:auto; background:#0e0e0e; border-bottom:1px solid #1a1a1a; }
  .cat-tab { background:#181818; border:1px solid #2a2a2a; color:#9a9a9a; padding:8px 16px; border-radius:18px; font-size:0.78rem; white-space:nowrap; cursor:pointer; font-family:inherit; }
  .cat-tab.active { background:#D4AF37; color:#000; border-color:#D4AF37; font-weight:600; }
  .stats { padding:14px 18px 6px; color:#888; font-size:0.85rem; }
  .stats strong { color:#D4AF37; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; padding:10px 14px 24px; }
  .card { background:#111; border:1px solid #2a1a1a; border-radius:10px; overflow:hidden; }
  .card.restored { border-color:#1f3a1f; }
  .video-wrap { position:relative; aspect-ratio:9/16; background:#000; cursor:pointer; }
  .video-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
  .video-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .play-tag { position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,0.7); color:#D4AF37; font-size:0.65rem; padding:3px 8px; border-radius:10px; letter-spacing:0.05em; }
  .body { padding:10px 12px 12px; }
  .name { font-size:0.85rem; color:#e8e8e8; line-height:1.3; margin-bottom:6px; min-height:2.4em; }
  .date { font-size:0.7rem; color:#666; margin-bottom:10px; }
  button.restore { width:100%; background:#D4AF37; color:#000; border:none; padding:10px; border-radius:6px; font-weight:700; font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; font-family:inherit; }
  button.restore:disabled { background:#3a3a3a; color:#888; cursor:default; }
  button.restore.done { background:#1f3a1f; color:#5cba5c; }
  .empty { text-align:center; padding:60px 20px; color:#666; font-size:0.95rem; }
  .err { background:#3a1010; border:1px solid #6a2222; color:#ff8888; padding:12px 16px; margin:14px; border-radius:6px; font-size:0.85rem; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1f3a1f; color:#5cba5c; padding:12px 22px; border-radius:8px; font-size:0.85rem; z-index:30; opacity:0; transition:opacity 0.25s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <h1>🌸 Archive</h1>
  <p>Deactivated videos by category. Tap Restore to put one back on the site.</p>
</header>

<div class="cat-tabs" id="cat-tabs"></div>
<div class="stats" id="stats">Loading…</div>
<div id="content"></div>
<div class="toast" id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';
const CATEGORIES = [
  ['mothers-day', "Mother's Day"],
  ['birthday', 'Birthday'],
  ['fathers-day', "Father's Day"],
  ['graduation', 'Graduation'],
  ['anniversary', 'Anniversary'],
  ['love', 'Love'],
  ['luxury', 'Luxury'],
  ['celebration', 'Celebration'],
  ['signature-stories', 'Signature Stories'],
  ['friendship', 'Friendship'],
  ['valentine', 'Valentine'],
  ['sports', 'Sports'],
  ['general', 'General'],
];
let currentCat = params.get('category') || 'mothers-day';

function tabs() {
  const el = document.getElementById('cat-tabs');
  el.innerHTML = CATEGORIES.map(([slug, label]) =>
    `<button class="cat-tab ${slug===currentCat?'active':''}" data-cat="${slug}">${label}</button>`
  ).join('');
  el.querySelectorAll('.cat-tab').forEach(b => b.onclick = () => {
    currentCat = b.dataset.cat;
    history.replaceState(null, '', `?category=${currentCat}&token=${TOKEN}`);
    tabs(); load();
  });
}

function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? '#1f3a1f' : '#3a1010';
  t.style.color = ok ? '#5cba5c' : '#ff8888';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function restore(id, btn) {
  btn.disabled = true; btn.textContent = 'Restoring…';
  try {
    const r = await fetch('/api/admin/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, productId: id, action: 'restore' }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    btn.classList.add('done'); btn.textContent = '✓ On Site';
    btn.closest('.card').classList.add('restored');
    toast('Put back on site');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Restore';
    toast(e.message, false);
  }
}

async function load() {
  document.getElementById('stats').textContent = 'Loading…';
  document.getElementById('content').innerHTML = '';
  if (!TOKEN) {
    document.getElementById('content').innerHTML = '<div class="err">Missing access token. Bookmark URL must include <code>?token=…</code></div>';
    document.getElementById('stats').textContent = '';
    return;
  }
  try {
    const r = await fetch(`/api/admin/archive?token=${encodeURIComponent(TOKEN)}&category=${currentCat}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    const items = j.products || [];
    document.getElementById('stats').innerHTML = `<strong>${items.length}</strong> deactivated · ${CATEGORIES.find(c=>c[0]===currentCat)?.[1] || currentCat}`;
    if (!items.length) {
      document.getElementById('content').innerHTML = '<div class="empty">Nothing in the archive for this category.</div>';
      return;
    }
    document.getElementById('content').innerHTML = `<div class="grid">${items.map(p => {
      const vid = p.video_file_url || p.video_url || '';
      const poster = p.thumbnail_url || p.image_url || '';
      const date = p.created_at ? new Date(p.created_at).toLocaleDateString() : '';
      const name = (p.name || 'Untitled').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
      const media = vid
        ? `<video src="${vid}" preload="metadata" playsinline muted ${poster?`poster="${poster}"`:''} onclick="this.paused?this.play():this.pause()"></video><div class="play-tag">▶ Tap to play</div>`
        : poster ? `<img src="${poster}" alt="">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#444;font-size:0.7rem;">no preview</div>`;
      return `<div class="card">
        <div class="video-wrap">${media}</div>
        <div class="body">
          <div class="name">${name}</div>
          <div class="date">${date}</div>
          <button class="restore" onclick="restore('${p.id}', this)">Restore</button>
        </div>
      </div>`;
    }).join('')}</div>`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="err">${e.message}</div>`;
    document.getElementById('stats').textContent = '';
  }
}

tabs(); load();
</script>
</body>
</html>
