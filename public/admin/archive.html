<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Digital Bloom — Video Archive</title>
<link rel="icon" type="image/svg+xml" href="/admin/archive-icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/admin/archive-icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/admin/archive-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/admin/archive-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/admin/archive-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="/admin/archive-icon-120.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Video Archive">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1B36">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0D1B36; color:#f4ebd0; font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; min-height:100vh; padding-bottom:40px; }
  header { background:#0a142a; border-bottom:2px solid #D4AF37; padding:18px 18px 14px; position:sticky; top:0; z-index:5; }
  header h1 { color:#D4AF37; font-size:1.05rem; letter-spacing:0.1em; text-transform:uppercase; font-family:Georgia,serif; }
  header p { color:#8da4c5; font-size:0.78rem; margin-top:4px; }

  .mode-toggle { display:flex; gap:0; padding:12px 14px 6px; background:#0D1B36; border-bottom:1px solid #1a2a4a; }
  .mode-btn { flex:1; background:transparent; border:1px solid #2a3e5e; color:#8da4c5; padding:10px 4px; font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; font-family:inherit; cursor:pointer; }
  .mode-btn:first-child { border-radius:6px 0 0 6px; border-right:none; }
  .mode-btn:not(:first-child):not(:last-child) { border-right:none; }
  .mode-btn:last-child { border-radius:0 6px 6px 0; }
  .mode-btn.active { background:#D4AF37; color:#0D1B36; border-color:#D4AF37; font-weight:700; }

  .cat-tabs { display:flex; gap:8px; padding:10px 14px 14px; overflow-x:auto; background:#0D1B36; border-bottom:1px solid #1a2a4a; }
  .cat-tab { background:#152544; border:1px solid #2a3e5e; color:#a8c0e0; padding:8px 16px; border-radius:18px; font-size:0.78rem; white-space:nowrap; cursor:pointer; font-family:inherit; }
  .cat-tab.active { background:#D4AF37; color:#0D1B36; border-color:#D4AF37; font-weight:600; }

  .stats { padding:14px 18px 6px; color:#8da4c5; font-size:0.85rem; }
  .stats strong { color:#D4AF37; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; padding:10px 14px 24px; }
  .card { background:#152544; border:1px solid #2a3e5e; border-radius:10px; overflow:hidden; position:relative; }
  .card.archive-mode { border-color:#3a2a14; }
  .card.toggled { border-color:#1f3a1f; }
  .video-wrap { position:relative; aspect-ratio:9/16; background:linear-gradient(160deg,#0a142a 0%,#0d1b36 50%,#152544 100%); cursor:pointer; overflow:hidden; }
  .video-wrap video, .video-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .video-wrap .placeholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#D4AF37; padding:18px; text-align:center; }
  .video-wrap .placeholder .play-circle { width:54px; height:54px; border-radius:50%; background:rgba(212,175,55,0.18); border:2px solid #D4AF37; display:flex; align-items:center; justify-content:center; font-size:1.6rem; padding-left:5px; }
  .video-wrap .placeholder .label { font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; opacity:0.85; font-family:Georgia,serif; }

  /* Status pill on Renders cards */
  .pill { display:inline-block; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; padding:3px 8px; border-radius:10px; font-weight:700; margin-bottom:6px; font-family:inherit; }
  .pill.live { background:#1f3a1f; color:#9be39b; border:1px solid #2c5a2c; }
  .pill.new  { background:#0a142a; color:#D4AF37; border:1px solid #D4AF37; }

  /* "NEW RENDER AVAILABLE" diagonal ribbon on Archive cards */
  .ribbon {
    position:absolute; top:14px; right:-32px;
    background:linear-gradient(90deg,#D4AF37,#a8842a);
    color:#0D1B36; font-size:0.55rem; font-weight:800; letter-spacing:0.12em;
    padding:4px 36px; transform:rotate(35deg); text-transform:uppercase;
    box-shadow:0 2px 6px rgba(0,0,0,0.4); z-index:2; pointer-events:none;
    font-family:inherit;
  }

  .body { padding:10px 12px 12px; }
  .name { font-size:0.85rem; color:#f4ebd0; line-height:1.3; margin-bottom:4px; min-height:2.4em; font-family:Georgia,serif; }
  .cat-line { font-size:0.65rem; color:#8da4c5; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:4px; }
  .date { font-size:0.7rem; color:#7a8fad; margin-bottom:4px; }
  .audit { font-size:0.65rem; color:#8da4c5; margin-bottom:10px; font-style:italic; }
  .audit::before { content:'by '; opacity:0.6; font-style:normal; }
  .audit:empty { display:none; }

  button.action { width:100%; border:none; padding:10px; border-radius:6px; font-weight:700; font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; font-family:inherit; }
  button.action.publish { background:#D4AF37; color:#0D1B36; }
  button.action.refresh { background:#1a2c4d; color:#D4AF37; border:1px solid #D4AF37; }
  button.action.restore { background:#D4AF37; color:#0D1B36; }
  button.action.archive { background:#1a2c4d; color:#D4AF37; border:1px solid #D4AF37; }
  button.action.buffer { background:#0f2f24; color:#9be39b; border:1px solid #2f8f65; margin-top:8px; }
  button.action.buffer-copy { background:#0a142a; color:#f4ebd0; border:1px solid #2a3e5e; margin-top:8px; }
  button.action.buffer-open { background:#D4AF37; color:#0D1B36; margin-top:8px; }
  button.action:disabled { background:#2a3e5e; color:#7a8fad; border-color:#2a3e5e; cursor:default; }
  button.action.done { background:#1f3a1f; color:#5cba5c; border:1px solid #1f3a1f; }
  .buffer-state { display:inline-block; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; padding:3px 8px; border-radius:10px; font-weight:700; margin:0 0 6px 6px; border:1px solid #2a3e5e; color:#8da4c5; }
  .buffer-state.approved { background:#0f2f24; color:#9be39b; border-color:#2f8f65; }
  .buffer-actions { display:grid; grid-template-columns:1fr; gap:0; }

  .empty { text-align:center; padding:60px 20px; color:#7a8fad; font-size:0.95rem; }
  .err { background:#3a1010; border:1px solid #6a2222; color:#ff8888; padding:12px 16px; margin:14px; border-radius:6px; font-size:0.85rem; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:12px 22px; border-radius:8px; font-size:0.85rem; z-index:30; opacity:0; transition:opacity 0.25s; pointer-events:none; max-width:88vw; text-align:center; }
  .toast.show { opacity:1; }

  /* ── Feedback (comments) UI ─────────────────────────────────────── */
  /* Bottom-right per Gamble — top-left collided with the Safari page-expander control on iPhone. */
  .fb-icon { position:absolute; bottom:8px; right:8px; z-index:3; background:rgba(13,27,54,0.78); border:1px solid #D4AF37; color:#D4AF37; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85rem; cursor:pointer; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .fb-icon:hover { background:rgba(212,175,55,0.18); }
  .fb-icon .fb-badge { position:absolute; top:-5px; right:-5px; background:#D4AF37; color:#0D1B36; font-size:0.55rem; font-weight:800; min-width:16px; height:16px; padding:0 4px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .fb-icon .fb-badge:empty { display:none; }
  .fb-modal { position:fixed; inset:0; background:rgba(8,15,30,0.86); z-index:40; display:none; align-items:center; justify-content:center; padding:18px; }
  .fb-modal.show { display:flex; }
  .fb-modal__panel { background:#0f1c36; border:1px solid #D4AF37; border-radius:12px; padding:18px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; }
  .fb-modal__title { color:#D4AF37; font-family:Georgia,serif; font-size:0.95rem; letter-spacing:0.05em; margin-bottom:4px; }
  .fb-modal__sub { color:#8da4c5; font-size:0.75rem; margin-bottom:14px; }
  .fb-modal__list { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; max-height:280px; overflow-y:auto; }
  .fb-modal__list:empty { display:none; }
  .fb-comment { background:#152544; border:1px solid #2a3e5e; border-radius:8px; padding:10px 12px; }
  .fb-comment.resolved { opacity:0.5; }
  .fb-comment__head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:0.7rem; }
  .fb-comment__author { color:#D4AF37; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; }
  .fb-comment__date { color:#7a8fad; }
  .fb-comment__body { color:#f4ebd0; font-size:0.88rem; line-height:1.4; white-space:pre-wrap; }
  .fb-comment__resolve { background:transparent; border:1px solid #2a3e5e; color:#8da4c5; font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase; padding:5px 10px; margin-top:8px; border-radius:14px; cursor:pointer; font-family:inherit; }
  .fb-comment__resolve:hover { background:#1f3a1f; border-color:#2c5a2c; color:#9be39b; }
  .fb-form label { display:block; color:#8da4c5; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; margin:8px 0 4px; }
  .fb-form select, .fb-form textarea { width:100%; background:#0a142a; border:1px solid #2a3e5e; color:#f4ebd0; padding:10px; border-radius:6px; font-size:0.9rem; font-family:inherit; }
  .fb-form textarea { resize:vertical; min-height:90px; }
  .fb-form__row { display:flex; gap:8px; margin-top:14px; }
  .fb-form__row button { flex:1; padding:11px; border:none; border-radius:6px; font-weight:700; font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; font-family:inherit; }
  .fb-form__row button.cancel { background:#1a2c4d; color:#8da4c5; border:1px solid #2a3e5e; }
  .fb-form__row button.save { background:#D4AF37; color:#0D1B36; }
  .fb-form__row button.save:disabled { opacity:0.4; cursor:default; }

  /* Feedback queue tab — list view of every open comment */
  .fb-queue { padding:10px 14px 24px; display:flex; flex-direction:column; gap:10px; }
  .fb-row { background:#152544; border:1px solid #2a3e5e; border-radius:10px; padding:12px; display:grid; grid-template-columns:80px 1fr; gap:12px; }
  .fb-row.resolved { opacity:0.45; }
  .fb-row__thumb { width:80px; height:80px; border-radius:6px; background:#0a142a; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .fb-row__thumb img, .fb-row__thumb video { width:100%; height:100%; object-fit:cover; }
  .fb-row__thumb .fb-row__placeholder { color:#D4AF37; opacity:0.4; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; text-align:center; padding:6px; }
  .fb-row__main { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .fb-row__head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:0.65rem; color:#7a8fad; letter-spacing:0.05em; text-transform:uppercase; }
  .fb-row__author { color:#D4AF37; font-weight:700; }
  .fb-row__title { color:#f4ebd0; font-size:0.88rem; font-family:Georgia,serif; }
  .fb-row__title a { color:#f4ebd0; text-decoration:none; border-bottom:1px dotted #5a7090; }
  .fb-row__body { color:#cbdaf0; font-size:0.85rem; line-height:1.4; white-space:pre-wrap; }
  .fb-row__actions { display:flex; gap:6px; margin-top:6px; }
  .fb-row__actions button { background:#0a142a; border:1px solid #2a3e5e; color:#8da4c5; font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase; padding:6px 12px; border-radius:14px; cursor:pointer; font-family:inherit; }
  .fb-row__actions button.resolve:hover { background:#1f3a1f; border-color:#2c5a2c; color:#9be39b; }
</style>
</head>
<body>

<header>
  <h1>🌸 Video Archive</h1>
  <p>Renders, On Site, Archive — one tap to publish or restore.</p>
</header>

<div class="mode-toggle" id="mode-toggle">
  <button class="mode-btn" data-mode="renders">Renders</button>
  <button class="mode-btn" data-mode="active">On Site</button>
  <button class="mode-btn" data-mode="inactive">Archive</button>
  <button class="mode-btn" data-mode="marketing">Marketing</button>
  <button class="mode-btn" data-mode="feedback">Feedback</button>
</div>

<div class="cat-tabs" id="cat-tabs"></div>
<div class="stats" id="stats">Loading…</div>
<div id="content"></div>
<div class="toast" id="toast"></div>

<!-- Feedback modal — shared across every card -->
<div class="fb-modal" id="fb-modal" onclick="if(event.target===this) closeFb()">
  <div class="fb-modal__panel">
    <div class="fb-modal__title" id="fb-title">Feedback</div>
    <div class="fb-modal__sub" id="fb-sub"></div>
    <div class="fb-modal__list" id="fb-list"></div>
    <div class="fb-form">
      <label for="fb-author">Who's commenting?</label>
      <select id="fb-author">
        <option value="gamble">Gamble</option>
        <option value="ak">Ak</option>
        <option value="david">David</option>
        <option value="other">Other</option>
      </select>
      <label for="fb-body">Directive / comment</label>
      <textarea id="fb-body" placeholder="e.g. Use this as the flyer, add red+gold text 'Don't forget mom'"></textarea>
      <div class="fb-form__row">
        <button class="cancel" onclick="closeFb()">Close</button>
        <button class="save" id="fb-save" onclick="saveFb()">Save comment</button>
      </div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const TOKEN_KEY = 'db_admin_token';
const URL_TOKEN = params.get('token') || '';
if (URL_TOKEN) {
  try { localStorage.setItem(TOKEN_KEY, URL_TOKEN); } catch (e) {}
}
const TOKEN = URL_TOKEN || (() => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } })();
// IMPORTANT: every slug here must exist in src/data/categories.js. The API
// silently returns empty when a slug has no canonical mapping, so a phantom
// chip would just look broken (better than the old behavior which leaked
// every category's renders). Order is: Mother's-Day-first while she's the
// top priority through May 10, then evergreen + occasion buckets. New
// categories must be added BOTH here and in src/data/categories.js.
const CATEGORIES = [
  ['mothers-day', "Mother's Day"],
  ['birthday', 'Birthday'],
  ['fathers-day', "Father's Day"],
  ['graduation', 'Graduation'],
  ['acknowledgement', 'Acknowledgement'],
  ['anniversary', 'Anniversary'],
  ['love', 'Love'],
  ['luxury', 'Luxury'],
  ['celebration', 'Celebration'],
  ['signature-stories', 'Signature Stories'],
  ['friendship', 'Friendship'],
  ['valentine', 'Valentine'],
  ['christmas', 'Christmas'],
  ['holidays', 'Holidays'],
  ['encouragement', 'Encouragement'],
  ['thank-you', 'Thank You'],
  ['sympathy', 'Sympathy'],
  ['grief', 'Grief'],
  ['zodiac', 'Zodiac'],
];
let currentCat = params.get('category') || 'mothers-day';
let currentMode = params.get('mode') || 'renders';
const VALID_MODES = new Set(['renders', 'active', 'inactive', 'marketing', 'feedback']);
if (!VALID_MODES.has(currentMode)) currentMode = 'renders';

// Per-target open-feedback counts loaded once per tab change so card
// badges show the count without N+1 fetches.
let feedbackCountIndex = {}; // key = `${kind}:${ref}` → number
let marketingApprovalIndex = {}; // key = filename → true when open feedback has BUFFER_APPROVED marker
async function loadFeedbackCounts() {
  if (!TOKEN) return;
  try {
    const r = await fetch(`/api/admin/feedback?token=${encodeURIComponent(TOKEN)}&status=open&limit=500`);
    if (!r.ok) return;
    const j = await r.json();
    const idx = {};
    const approvals = {};
    for (const f of j.feedback || []) {
      if (f.target_kind === 'marketing' && String(f.body || '').startsWith('[BUFFER_APPROVED]')) {
        approvals[f.target_ref] = true;
        continue;
      }
      const k = `${f.target_kind}:${f.target_ref}`;
      idx[k] = (idx[k] || 0) + 1;
    }
    feedbackCountIndex = idx;
    marketingApprovalIndex = approvals;
  } catch {}
}

function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set('category', currentCat);
  u.searchParams.set('mode', currentMode);
  history.replaceState(null, '', u);
}

function tabs() {
  const el = document.getElementById('cat-tabs');
  // Marketing + Feedback aren't keyed off prompt-engine cat. Hide the
  // category strip when in those modes.
  if (currentMode === 'marketing' || currentMode === 'feedback') {
    el.style.display = 'none';
  } else {
    el.style.display = '';
    el.innerHTML = CATEGORIES.map(([slug, label]) =>
      `<button class="cat-tab ${slug===currentCat?'active':''}" data-cat="${slug}">${label}</button>`
    ).join('');
    el.querySelectorAll('.cat-tab').forEach(b => b.onclick = () => {
      currentCat = b.dataset.cat; syncUrl(); tabs(); load();
    });
  }
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === currentMode);
    b.onclick = () => { currentMode = b.dataset.mode; syncUrl(); tabs(); load(); };
  });
}

// ── Feedback modal helpers ─────────────────────────────────────────
let fbContext = null; // { kind, ref, label, thumb_url, video_url }

function fbBadge(kind, ref) {
  const n = feedbackCountIndex[`${kind}:${ref}`] || 0;
  if (!n) return '';
  return `<span class="fb-badge">${n}</span>`;
}

function fbIcon(kind, ref, label, thumbUrl, videoUrl) {
  const safe = (v) => String(v || '').replace(/'/g, "\\'");
  const onclick = `openFb('${safe(kind)}', '${safe(ref)}', '${safe(label)}', '${safe(thumbUrl)}', '${safe(videoUrl)}')`;
  return `<button class="fb-icon" onclick="event.stopPropagation();${onclick}" aria-label="Comments">💬${fbBadge(kind, ref)}</button>`;
}

async function openFb(kind, ref, label, thumbUrl, videoUrl) {
  fbContext = { kind, ref, label, thumb_url: thumbUrl, video_url: videoUrl };
  document.getElementById('fb-title').textContent = label || `${kind} feedback`;
  document.getElementById('fb-sub').textContent = `${kind} · ${ref.slice(0, 40)}`;
  document.getElementById('fb-body').value = '';
  document.getElementById('fb-list').innerHTML = '<div style="color:#7a8fad;font-size:0.8rem;padding:8px 4px">Loading…</div>';
  document.getElementById('fb-modal').classList.add('show');
  try {
    const r = await fetch(`/api/admin/feedback?token=${encodeURIComponent(TOKEN)}&target_kind=${encodeURIComponent(kind)}&target_ref=${encodeURIComponent(ref)}&limit=50`);
    const j = await r.json();
    const items = j.feedback || [];
    if (!items.length) {
      document.getElementById('fb-list').innerHTML = '<div style="color:#7a8fad;font-size:0.8rem;padding:8px 4px">No comments yet — be the first.</div>';
    } else {
      document.getElementById('fb-list').innerHTML = items.map(c => `
        <div class="fb-comment ${c.status === 'resolved' ? 'resolved' : ''}">
          <div class="fb-comment__head">
            <span class="fb-comment__author">${escape(c.author)}</span>
            <span class="fb-comment__date">${fmtDate(c.created_at)}${c.status==='resolved' ? ' · resolved' : ''}</span>
          </div>
          <div class="fb-comment__body">${escape(c.body)}</div>
          ${c.status === 'open'
            ? `<button class="fb-comment__resolve" onclick="resolveFb('${c.id}')">✓ Mark resolved</button>`
            : ''}
        </div>
      `).join('');
    }
  } catch (e) {
    document.getElementById('fb-list').innerHTML = `<div style="color:#ff8888">${e.message}</div>`;
  }
}

function closeFb() {
  document.getElementById('fb-modal').classList.remove('show');
  fbContext = null;
}

async function saveFb() {
  if (!fbContext) return;
  const author = document.getElementById('fb-author').value;
  const body = document.getElementById('fb-body').value.trim();
  if (!body) { toast('Comment is empty.', false); return; }
  const btn = document.getElementById('fb-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await fetch('/api/admin/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: TOKEN,
        target_kind: fbContext.kind,
        target_ref: fbContext.ref,
        target_label: fbContext.label,
        target_thumb_url: fbContext.thumb_url,
        target_video_url: fbContext.video_url,
        author,
        body,
      }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    toast('Comment saved.');
    closeFb();
    await loadFeedbackCounts();
    load(); // refresh card badges
  } catch (e) {
    toast(e.message, false);
    btn.disabled = false; btn.textContent = 'Save comment';
  }
}

async function resolveFb(id) {
  try {
    const r = await fetch('/api/admin/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, action: 'resolve', id, resolved_by: 'admin' }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || 'failed');
    }
    toast('Marked resolved.');
    await loadFeedbackCounts();
    if (currentMode === 'feedback') {
      load();
    } else if (fbContext) {
      openFb(fbContext.kind, fbContext.ref, fbContext.label, fbContext.thumb_url, fbContext.video_url);
    }
  } catch (e) { toast(e.message, false); }
}

function feedbackQueue(items) {
  if (!items.length) {
    return `<div class="empty">No open feedback. Comments left on any item show up here.</div>`;
  }
  return `<div class="fb-queue">${items.map(c => {
    const thumb = c.target_video_url
      ? `<video src="${escape(c.target_video_url)}" muted preload="metadata" playsinline></video>`
      : c.target_thumb_url
        ? `<img src="${escape(c.target_thumb_url)}" alt="">`
        : `<div class="fb-row__placeholder">${escape(c.target_kind)}</div>`;
    const titleText = c.target_label || `${c.target_kind} ${c.target_ref.slice(0, 8)}`;
    const titleLink = c.target_kind === 'product'
      ? `<a href="${location.pathname}?token=${encodeURIComponent(TOKEN)}&mode=active&category=${currentCat}#${c.target_ref}">${escape(titleText)}</a>`
      : escape(titleText);
    return `<div class="fb-row ${c.status==='resolved' ? 'resolved' : ''}">
      <div class="fb-row__thumb">${thumb}</div>
      <div class="fb-row__main">
        <div class="fb-row__head">
          <span class="fb-row__author">${escape(c.author)}</span>
          <span>${fmtDate(c.created_at)}${c.status==='resolved' ? ' · resolved' : ''}</span>
        </div>
        <div class="fb-row__title">${titleLink}</div>
        <div class="fb-row__body">${escape(c.body)}</div>
        ${c.status==='open' ? `<div class="fb-row__actions">
          <button class="resolve" onclick="resolveFb('${c.id}')">✓ Mark resolved</button>
        </div>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? '#1f3a1f' : '#3a1010';
  t.style.color = ok ? '#5cba5c' : '#ff8888';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function loadVideo(el) {
  const src = el.dataset.src;
  if (!src) return;
  const poster = el.dataset.poster || '';
  const wrap = el.parentElement;
  const v = document.createElement('video');
  v.src = src; v.controls = true; v.playsInline = true; v.autoplay = true;
  v.preload = 'auto'; v.muted = true;
  if (poster) v.poster = poster;
  v.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
  el.remove();
  wrap.appendChild(v);
}

function escape(s) {
  return String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}
function jsArg(s) {
  return JSON.stringify(String(s ?? '')).replace(/[<>&"]/g, c => ({'<':'\\u003C','>':'\\u003E','&':'\\u0026','"':'&quot;'}[c]));
}

function fmtDate(s) {
  if (!s) return '';
  try {
    const d = new Date(s);
    const date = d.toLocaleDateString();
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return `${date} · ${time}`;
  } catch { return ''; }
}

function fmtAudit(by, at) {
  if (!by || !at) return '';
  try {
    const d = new Date(at);
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    return sameDay ? `${by} · ${time}` : `${by} · ${d.toLocaleDateString()} ${time}`;
  } catch { return by; }
}

async function publishRender(promptId, productId, btn, refresh) {
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = refresh ? 'Refreshing…' : 'Publishing…';
  try {
    const r = await fetch('/api/admin/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, action: 'publish', promptId, productId }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    btn.classList.add('done');
    btn.textContent = '✓ Live on site';
    btn.closest('.card').classList.add('toggled');
    toast(refresh ? 'Refreshed on site.' : 'Published to site.');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = orig;
    toast(e.message, false);
  }
}

async function smartRestore(productId, btn) {
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Restoring…';
  try {
    const r = await fetch('/api/admin/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, action: 'restore', productId }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    btn.classList.add('done');
    btn.textContent = j.freshlyRepublished ? '✓ Restored (new render)' : '✓ On Site';
    btn.closest('.card').classList.add('toggled');
    toast(j.freshlyRepublished ? 'Restored with new Grok render.' : 'Restored.');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = orig;
    toast(e.message, false);
  }
}

function rendersGrid(items) {
  return items.map(p => {
    const name = escape(p.title || 'Untitled');
    const cat = escape(p.cat || '');
    const date = fmtDate(p.completed_at);
    const isLive = p.is_live;
    const pill = isLive
      ? `<span class="pill live">Live on site</span>`
      : `<span class="pill new">New render</span>`;
    const btnLabel = isLive ? 'Refresh on Site' : 'Publish to Site';
    const btnClass = isLive ? 'refresh' : 'publish';
    const safeProductId = p.product_id ? `'${p.product_id}'` : 'null';
    const audit = isLive ? escape(fmtAudit(p.last_action_by, p.last_action_at)) : '';
    const media = p.render_url
      ? `<div class="placeholder" data-src="${p.render_url}" onclick="loadVideo(this)"><div class="play-circle">▶</div><div class="label">Tap to play</div></div>`
      : `<div class="placeholder"><div class="label" style="opacity:0.5">no preview</div></div>`;
    return `<div class="card">
      <div class="video-wrap">${media}${fbIcon('render', p.id, p.title || 'Untitled', '', p.render_url || '')}</div>
      <div class="body">
        ${pill}
        <div class="name">${name}</div>
        <div class="cat-line">${cat}</div>
        <div class="date">${date}</div>
        <div class="audit">${audit}</div>
        <button class="action ${btnClass}" onclick="publishRender('${p.id}', ${safeProductId}, this, ${isLive})">${btnLabel}</button>
      </div>
    </div>`;
  }).join('');
}

function productsGrid(items, mode) {
  return items.map(p => {
    const name = escape(p.name || 'Untitled');
    const date = fmtDate(p.created_at);
    const stockVid = p.video_file_url || p.video_url || '';
    const freshVid = p.fresh_render_url || '';
    const vid = freshVid || stockVid;
    const poster = p.thumbnail_url || p.image_url || '';
    const isActive = mode === 'active';
    const ribbon = (!isActive && freshVid) ? `<div class="ribbon">New render available</div>` : '';
    const media = vid
      ? `<div class="placeholder" data-src="${vid}" ${poster?`data-poster="${poster}"`:''} onclick="loadVideo(this)"><div class="play-circle">▶</div><div class="label">Tap to play</div></div>`
      : poster ? `<img src="${poster}" alt="">` : `<div class="placeholder"><div class="label" style="opacity:0.5">no preview</div></div>`;
    const btnHandler = isActive
      ? `archiveProduct('${p.id}', this)`
      : `smartRestore('${p.id}', this)`;
    const btnLabel = isActive ? 'Archive' : (freshVid ? 'Restore (Smart)' : 'Restore');
    const btnClass = isActive ? 'archive' : 'restore';
    const cardClass = isActive ? 'archive-mode' : '';
    const audit = escape(fmtAudit(p.last_action_by, p.last_action_at));
    return `<div class="card ${cardClass}">
      ${ribbon}
      <div class="video-wrap">${media}${fbIcon('product', p.id, p.name || 'Untitled', poster, vid)}</div>
      <div class="body">
        <div class="name">${name}</div>
        <div class="date">${date}</div>
        <div class="audit">${audit}</div>
        <button class="action ${btnClass}" onclick="${btnHandler}">${btnLabel}</button>
      </div>
    </div>`;
  }).join('');
}

// Pretty-print a marketing draft filename like
// "2026-04-28-mothers-day-v3-kling-pro.mp4" → "Apr 28 · Mothers Day · v3 (Kling Pro)"
function prettyMarketingName(filename) {
  const stem = filename.replace(/\.mp4$/, '');
  const m = stem.match(/^(\d{4}-\d{2}-\d{2})-(.+?)-(v\d+)(?:-(.+))?$/);
  if (!m) return stem;
  const [, dateStr, occasion, version, model] = m;
  const occLabel = occasion.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
  const modelLabel = model ? ' (' + model.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join(' ') + ')' : '';
  let when = dateStr;
  try {
    const d = new Date(dateStr + 'T00:00:00');
    when = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  } catch {}
  return `${when} · ${occLabel} · ${version}${modelLabel}`;
}

const BUFFER_STATE_KEY = 'db_buffer_marketing_state_v1';
function readBufferState() {
  try { return JSON.parse(localStorage.getItem(BUFFER_STATE_KEY) || '{}'); } catch { return {}; }
}
function writeBufferState(state) {
  try { localStorage.setItem(BUFFER_STATE_KEY, JSON.stringify(state)); } catch {}
}
function bufferStatus(name) {
  if (marketingApprovalIndex[name]) return 'approved';
  return readBufferState()[name] || 'new';
}
async function persistBufferApproval(name, btn) {
  if (!TOKEN || marketingApprovalIndex[name]) return;
  const card = btn?.closest('.card');
  const label = card?.querySelector('.name')?.textContent || name;
  const video = card?.querySelector('video')?.getAttribute('src') || '';
  try {
    const r = await fetch('/api/admin/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: TOKEN,
        target_kind: 'marketing',
        target_ref: name,
        target_label: label,
        target_video_url: video,
        author: 'ak',
        body: '[BUFFER_APPROVED] Ready to queue in Buffer.',
      }),
    });
    if (r.ok) marketingApprovalIndex[name] = true;
  } catch {}
}
async function setBufferStatus(name, status, btn) {
  const state = readBufferState();
  state[name] = status;
  writeBufferState(state);
  if (status === 'approved') await persistBufferApproval(name, btn);
  if (btn) {
    btn.textContent = status === 'approved' ? '✓ Approved for Buffer' : 'Approve for Buffer';
    btn.classList.toggle('done', status === 'approved');
  }
  const card = btn?.closest('.card');
  const pill = card?.querySelector('.buffer-state');
  if (pill) {
    pill.textContent = status === 'approved' ? 'Buffer Approved' : 'Needs Approval';
    pill.classList.toggle('approved', status === 'approved');
  }
  toast(status === 'approved' ? 'Marked approved for Buffer.' : 'Approval cleared.');
}
async function toggleBufferApproval(name, btn) {
  if (bufferStatus(name) === 'approved') {
    toast('Already approved for Buffer.');
    return;
  }
  await setBufferStatus(name, 'approved', btn);
}
function marketingCaption(name) {
  const lower = name.toLowerCase();
  if (lower.includes('mothers-day') || lower.includes('mothers')) {
    return "Mother's Day is May 10. Send her flowers that bloom on her screen the moment she opens your message. Shine your love in the world. digitalbloom.store\\n\\n#MothersDay #MothersDayGift #DigitalBloom #ShineYourLove #DigitalFlowers";
  }
  if (lower.includes('birthday') || lower.includes('g-day') || lower.includes('gday')) {
    return "Make their birthday feel seen. Send a Digital Bloom that opens like a gift and blooms right on their phone. digitalbloom.store\\n\\n#BirthdayGift #DigitalBloom #ShineYourLove #DigitalFlowers #GiftIdeas";
  }
  if (lower.includes('love') || lower.includes('valentine')) {
    return "Love does not need to wait for a holiday. Send flowers that bloom on their screen today. digitalbloom.store\\n\\n#DigitalBloom #ShineYourLove #LoveGift #DigitalFlowers";
  }
  if (lower.includes('reach-out')) {
    return "Reach out while it still matters. Send a Digital Bloom and let somebody feel loved today. digitalbloom.store\\n\\n#DigitalBloom #ShineYourLove #GiveThemTheirFlowers #DigitalFlowers";
  }
  if (lower.includes('flowers-in-hand')) {
    return "Put the flowers in their hands while they are here to feel them. Send a Digital Bloom today. digitalbloom.store\\n\\n#DigitalBloom #GiveThemTheirFlowers #ShineYourLove #DigitalFlowers";
  }
  if (lower.includes('support')) {
    return "A little love and support can change the whole day. Send a Digital Bloom that opens on their phone. digitalbloom.store\\n\\n#DigitalBloom #ShineYourLove #ThinkingOfYou #DigitalFlowers";
  }
  return "Send flowers that bloom on their phone screen. Personal. Cinematic. Ready when your heart is. digitalbloom.store\\n\\n#DigitalBloom #ShineYourLove #DigitalFlowers";
}
async function copyBufferPack(name, url, btn) {
  const caption = marketingCaption(name);
  const pack = `ASSET URL:\\n${url}\\n\\nCAPTION:\\n${caption}\\n\\nBUFFER NOTE:\\nQueue to Creative Vision Pro LLC / Digital Bloom social channels. Suggested platforms: Instagram, Facebook, TikTok, Pinterest, X.`;
  try {
    await navigator.clipboard.writeText(pack);
    btn.textContent = '✓ Buffer pack copied';
    setTimeout(()=>btn.textContent='Copy Buffer Pack', 1800);
    toast('Buffer caption + URL copied.');
  } catch {
    toast('Could not copy Buffer pack.');
  }
}
function openBufferComposer() {
  window.open('https://publish.buffer.com/', '_blank', 'noopener');
}

function marketingGrid(items) {
  return items.map(p => {
    const pretty = escape(prettyMarketingName(p.name));
    const date = fmtDate(p.created_at);
    const sizeKb = p.size ? Math.round(p.size / 1024) : null;
    const ageMs = p.created_at ? (Date.now() - new Date(p.created_at).getTime()) : Infinity;
    const isNew = ageMs < 24 * 60 * 60 * 1000;
    const newPill = isNew ? `<span class="pill new">New</span>` : '';
    const status = bufferStatus(p.name);
    const bufferPill = `<span class="buffer-state ${status === 'approved' ? 'approved' : ''}">${status === 'approved' ? 'Buffer Approved' : 'Needs Approval'}</span>`;
    const approveLabel = status === 'approved' ? '✓ Approved for Buffer' : 'Approve for Buffer';
    const sizeLine = sizeKb ? `<div class="cat-line">${sizeKb} KB · ${escape(p.name)}</div>` : `<div class="cat-line">${escape(p.name)}</div>`;
    // Inline <video controls> so Ak can tap to play. Audio ON for marketing
    // (commercials have dialogue / music) — different from bloom previews.
    return `<div class="card">
      <div class="video-wrap">
        <video src="${escape(p.url)}" controls preload="metadata" playsinline style="width:100%;height:100%;object-fit:cover;display:block"></video>
        ${fbIcon('marketing', p.name, pretty, '', p.url)}
      </div>
      <div class="body">
        ${newPill}${bufferPill}
        <div class="name">${pretty}</div>
        ${sizeLine}
        <div class="date">${date}</div>
        <div class="buffer-actions">
          <button class="action archive" onclick="navigator.clipboard.writeText('${escape(p.url)}'); this.textContent='✓ URL copied'; setTimeout(()=>this.textContent='Copy URL', 1800)">Copy URL</button>
          <button class="action buffer ${status === 'approved' ? 'done' : ''}" onclick="toggleBufferApproval(${jsArg(p.name)}, this)">${approveLabel}</button>
          <button class="action buffer-copy" onclick="copyBufferPack(${jsArg(p.name)}, ${jsArg(p.url)}, this)">Copy Buffer Pack</button>
          <button class="action buffer-open" onclick="openBufferComposer()">Open Buffer</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function load() {
  document.getElementById('stats').textContent = 'Loading…';
  document.getElementById('content').innerHTML = '';
  if (!TOKEN) {
    document.getElementById('content').innerHTML = '<div class="err">Missing access token. Bookmark URL must include <code>?token=…</code></div>';
    document.getElementById('stats').textContent = '';
    return;
  }

  // Feedback tab — its own data source (the feedback table, not the
  // archive endpoint).
  if (currentMode === 'feedback') {
    try {
      const r = await fetch(`/api/admin/feedback?token=${encodeURIComponent(TOKEN)}&status=open&limit=200`);
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'failed');
      const items = j.feedback || [];
      document.getElementById('stats').innerHTML = `<strong>${items.length}</strong> open ${items.length === 1 ? 'comment' : 'comments'} across all items`;
      document.getElementById('content').innerHTML = feedbackQueue(items);
    } catch (e) {
      document.getElementById('content').innerHTML = `<div class="err">${e.message}</div>`;
      document.getElementById('stats').textContent = '';
    }
    return;
  }

  // Refresh per-card open-comment counts before rendering the grid so
  // badges show alongside the cards.
  await loadFeedbackCounts();

  try {
    const r = await fetch(`/api/admin/archive?token=${encodeURIComponent(TOKEN)}&category=${currentCat}&status=${currentMode}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');

    const label = CATEGORIES.find(c=>c[0]===currentCat)?.[1] || currentCat;

    if (currentMode === 'marketing') {
      const items = j.marketing || [];
      document.getElementById('stats').innerHTML = `<strong>${items.length}</strong> commercials in the marketing folder`;
      if (!items.length) {
        document.getElementById('content').innerHTML = `<div class="empty">No marketing drafts yet. Files in monique-videos/commercial_drafts/ will surface here.</div>`;
        return;
      }
      document.getElementById('content').innerHTML = `<div class="grid">${marketingGrid(items)}</div>`;
    } else if (currentMode === 'renders') {
      const items = j.renders || [];
      const liveCount = items.filter(x => x.is_live).length;
      const newCount = items.length - liveCount;
      document.getElementById('stats').innerHTML = `<strong>${items.length}</strong> renders · ${label} · <strong>${newCount}</strong> new, ${liveCount} live`;
      if (!items.length) {
        document.getElementById('content').innerHTML = `<div class="empty">No completed renders for this category.</div>`;
        return;
      }
      document.getElementById('content').innerHTML = `<div class="grid">${rendersGrid(items)}</div>`;
    } else {
      const items = j.products || [];
      const modeLabel = currentMode === 'active' ? 'on the site' : 'in the archive';
      document.getElementById('stats').innerHTML = `<strong>${items.length}</strong> ${modeLabel} · ${label}`;
      if (!items.length) {
        const empty = currentMode === 'active' ? 'Nothing live on the site for this category.' : 'Nothing in the archive for this category.';
        document.getElementById('content').innerHTML = `<div class="empty">${empty}</div>`;
        return;
      }
      document.getElementById('content').innerHTML = `<div class="grid">${productsGrid(items, currentMode)}</div>`;
    }
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="err">${e.message}</div>`;
    document.getElementById('stats').textContent = '';
  }
}

tabs(); load();

// Auto-refresh every 20s so Ak and Gamble see each other's changes
// without manually reloading. Skips when the tab is hidden (saves
// battery / bandwidth) and when a card video is currently open
// (preserves playback — load() rebuilds the grid HTML, which would
// destroy a playing <video> element).
let autoRefreshTimer = null;
function startAutoRefresh() {
  if (autoRefreshTimer) return;
  autoRefreshTimer = setInterval(() => {
    if (document.hidden) return;
    if (document.querySelector('.video-wrap video')) return;
    load();
  }, 20000);
}
function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  document.hidden ? stopAutoRefresh() : startAutoRefresh();
});
startAutoRefresh();
</script>
