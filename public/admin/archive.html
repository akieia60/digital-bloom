<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Digital Bloom — Video Archive</title>
<link rel="icon" type="image/svg+xml" href="/admin/archive-icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/admin/archive-icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/admin/archive-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/admin/archive-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/admin/archive-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="/admin/archive-icon-120.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Video Archive">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1B36">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0D1B36; color:#f4ebd0; font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; min-height:100vh; padding-bottom:40px; }
  header { background:#0a142a; border-bottom:2px solid #D4AF37; padding:18px 18px 14px; position:sticky; top:0; z-index:5; }
  header h1 { color:#D4AF37; font-size:1.05rem; letter-spacing:0.1em; text-transform:uppercase; font-family:Georgia,serif; }
  header p { color:#8da4c5; font-size:0.78rem; margin-top:4px; }

  .mode-toggle { display:flex; gap:0; padding:12px 14px 6px; background:#0D1B36; border-bottom:1px solid #1a2a4a; }
  .mode-btn { flex:1; background:transparent; border:1px solid #2a3e5e; color:#8da4c5; padding:10px 4px; font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; font-family:inherit; cursor:pointer; }
  .mode-btn:first-child { border-radius:6px 0 0 6px; border-right:none; }
  .mode-btn:not(:first-child):not(:last-child) { border-right:none; }
  .mode-btn:last-child { border-radius:0 6px 6px 0; }
  .mode-btn.active { background:#D4AF37; color:#0D1B36; border-color:#D4AF37; font-weight:700; }

  .cat-tabs { display:flex; gap:8px; padding:10px 14px 14px; overflow-x:auto; background:#0D1B36; border-bottom:1px solid #1a2a4a; }
  .cat-tab { background:#152544; border:1px solid #2a3e5e; color:#a8c0e0; padding:8px 16px; border-radius:18px; font-size:0.78rem; white-space:nowrap; cursor:pointer; font-family:inherit; }
  .cat-tab.active { background:#D4AF37; color:#0D1B36; border-color:#D4AF37; font-weight:600; }

  .stats { padding:14px 18px 6px; color:#8da4c5; font-size:0.85rem; }
  .stats strong { color:#D4AF37; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; padding:10px 14px 24px; }
  .card { background:#152544; border:1px solid #2a3e5e; border-radius:10px; overflow:hidden; position:relative; }
  .card.archive-mode { border-color:#3a2a14; }
  .card.toggled { border-color:#1f3a1f; }
  .video-wrap { position:relative; aspect-ratio:9/16; background:linear-gradient(160deg,#0a142a 0%,#0d1b36 50%,#152544 100%); cursor:pointer; overflow:hidden; }
  .video-wrap video, .video-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .video-wrap .placeholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#D4AF37; padding:18px; text-align:center; }
  .video-wrap .placeholder .play-circle { width:54px; height:54px; border-radius:50%; background:rgba(212,175,55,0.18); border:2px solid #D4AF37; display:flex; align-items:center; justify-content:center; font-size:1.6rem; padding-left:5px; }
  .video-wrap .placeholder .label { font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; opacity:0.85; font-family:Georgia,serif; }

  /* Status pill on Renders cards */
  .pill { display:inline-block; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; padding:3px 8px; border-radius:10px; font-weight:700; margin-bottom:6px; font-family:inherit; }
  .pill.live { background:#1f3a1f; color:#9be39b; border:1px solid #2c5a2c; }
  .pill.new  { background:#0a142a; color:#D4AF37; border:1px solid #D4AF37; }

  /* "NEW RENDER AVAILABLE" diagonal ribbon on Archive cards */
  .ribbon {
    position:absolute; top:14px; right:-32px;
    background:linear-gradient(90deg,#D4AF37,#a8842a);
    color:#0D1B36; font-size:0.55rem; font-weight:800; letter-spacing:0.12em;
    padding:4px 36px; transform:rotate(35deg); text-transform:uppercase;
    box-shadow:0 2px 6px rgba(0,0,0,0.4); z-index:2; pointer-events:none;
    font-family:inherit;
  }

  .body { padding:10px 12px 12px; }
  .name { font-size:0.85rem; color:#f4ebd0; line-height:1.3; margin-bottom:4px; min-height:2.4em; font-family:Georgia,serif; }
  .cat-line { font-size:0.65rem; color:#8da4c5; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:4px; }
  .date { font-size:0.7rem; color:#7a8fad; margin-bottom:4px; }
  .audit { font-size:0.65rem; color:#8da4c5; margin-bottom:10px; font-style:italic; }
  .audit::before { content:'by '; opacity:0.6; font-style:normal; }
  .audit:empty { display:none; }

  button.action { width:100%; border:none; padding:10px; border-radius:6px; font-weight:700; font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; font-family:inherit; }
  button.action.publish { background:#D4AF37; color:#0D1B36; }
  button.action.refresh { background:#1a2c4d; color:#D4AF37; border:1px solid #D4AF37; }
  button.action.restore { background:#D4AF37; color:#0D1B36; }
  button.action.archive { background:#1a2c4d; color:#D4AF37; border:1px solid #D4AF37; }
  button.action:disabled { background:#2a3e5e; color:#7a8fad; border-color:#2a3e5e; cursor:default; }
  button.action.done { background:#1f3a1f; color:#5cba5c; border:1px solid #1f3a1f; }

  .empty { text-align:center; padding:60px 20px; color:#7a8fad; font-size:0.95rem; }
  .err { background:#3a1010; border:1px solid #6a2222; color:#ff8888; padding:12px 16px; margin:14px; border-radius:6px; font-size:0.85rem; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:12px 22px; border-radius:8px; font-size:0.85rem; z-index:30; opacity:0; transition:opacity 0.25s; pointer-events:none; max-width:88vw; text-align:center; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <h1>🌸 Video Archive</h1>
  <p>Renders, On Site, Archive — one tap to publish or restore.</p>
</header>

<div class="mode-toggle" id="mode-toggle">
  <button class="mode-btn" data-mode="renders">Renders</button>
  <button class="mode-btn" data-mode="active">On Site</button>
  <button class="mode-btn" data-mode="inactive">Archive</button>
  <button class="mode-btn" data-mode="marketing">Marketing</button>
</div>

<div class="cat-tabs" id="cat-tabs"></div>
<div class="stats" id="stats">Loading…</div>
<div id="content"></div>
<div class="toast" id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const TOKEN_KEY = 'db_admin_token';
const URL_TOKEN = params.get('token') || '';
if (URL_TOKEN) {
  try { localStorage.setItem(TOKEN_KEY, URL_TOKEN); } catch (e) {}
}
const TOKEN = URL_TOKEN || (() => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } })();
// IMPORTANT: every slug here must exist in src/data/categories.js. The API
// silently returns empty when a slug has no canonical mapping, so a phantom
// chip would just look broken (better than the old behavior which leaked
// every category's renders). Order is: Mother's-Day-first while she's the
// top priority through May 10, then evergreen + occasion buckets. New
// categories must be added BOTH here and in src/data/categories.js.
const CATEGORIES = [
  ['mothers-day', "Mother's Day"],
  ['birthday', 'Birthday'],
  ['fathers-day', "Father's Day"],
  ['graduation', 'Graduation'],
  ['acknowledgement', 'Acknowledgement'],
  ['anniversary', 'Anniversary'],
  ['love', 'Love'],
  ['luxury', 'Luxury'],
  ['celebration', 'Celebration'],
  ['signature-stories', 'Signature Stories'],
  ['friendship', 'Friendship'],
  ['valentine', 'Valentine'],
  ['christmas', 'Christmas'],
  ['holidays', 'Holidays'],
  ['encouragement', 'Encouragement'],
  ['thank-you', 'Thank You'],
  ['sympathy', 'Sympathy'],
  ['grief', 'Grief'],
  ['zodiac', 'Zodiac'],
];
let currentCat = params.get('category') || 'mothers-day';
let currentMode = params.get('mode') || 'renders';
const VALID_MODES = new Set(['renders', 'active', 'inactive', 'marketing']);
if (!VALID_MODES.has(currentMode)) currentMode = 'renders';

function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set('category', currentCat);
  u.searchParams.set('mode', currentMode);
  history.replaceState(null, '', u);
}

function tabs() {
  const el = document.getElementById('cat-tabs');
  // Marketing mode isn't keyed off prompt-engine cat — files in
  // monique-videos/commercial_drafts/ aren't bucketed by category.
  // Hide the category strip when in marketing mode.
  if (currentMode === 'marketing') {
    el.style.display = 'none';
  } else {
    el.style.display = '';
    el.innerHTML = CATEGORIES.map(([slug, label]) =>
      `<button class="cat-tab ${slug===currentCat?'active':''}" data-cat="${slug}">${label}</button>`
    ).join('');
    el.querySelectorAll('.cat-tab').forEach(b => b.onclick = () => {
      currentCat = b.dataset.cat; syncUrl(); tabs(); load();
    });
  }
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === currentMode);
    b.onclick = () => { currentMode = b.dataset.mode; syncUrl(); tabs(); load(); };
  });
}

function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? '#1f3a1f' : '#3a1010';
  t.style.color = ok ? '#5cba5c' : '#ff8888';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function loadVideo(el) {
  const src = el.dataset.src;
  if (!src) return;
  const poster = el.dataset.poster || '';
  const wrap = el.parentElement;
  const v = document.createElement('video');
  v.src = src; v.controls = true; v.playsInline = true; v.autoplay = true;
  v.preload = 'auto'; v.muted = true;
  if (poster) v.poster = poster;
  v.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
  el.remove();
  wrap.appendChild(v);
}

function escape(s) {
  return String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

function fmtDate(s) {
  if (!s) return '';
  try {
    const d = new Date(s);
    const date = d.toLocaleDateString();
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return `${date} · ${time}`;
  } catch { return ''; }
}

function fmtAudit(by, at) {
  if (!by || !at) return '';
  try {
    const d = new Date(at);
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    return sameDay ? `${by} · ${time}` : `${by} · ${d.toLocaleDateString()} ${time}`;
  } catch { return by; }
}

async function publishRender(promptId, productId, btn, refresh) {
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = refresh ? 'Refreshing…' : 'Publishing…';
  try {
    const r = await fetch('/api/admin/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, action: 'publish', promptId, productId }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    btn.classList.add('done');
    btn.textContent = '✓ Live on site';
    btn.closest('.card').classList.add('toggled');
    toast(refresh ? 'Refreshed on site.' : 'Published to site.');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = orig;
    toast(e.message, false);
  }
}

async function smartRestore(productId, btn) {
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Restoring…';
  try {
    const r = await fetch('/api/admin/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, action: 'restore', productId }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    btn.classList.add('done');
    btn.textContent = j.freshlyRepublished ? '✓ Restored (new render)' : '✓ On Site';
    btn.closest('.card').classList.add('toggled');
    toast(j.freshlyRepublished ? 'Restored with new Grok render.' : 'Restored.');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = orig;
    toast(e.message, false);
  }
}

async function archiveProduct(productId, btn) {
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Archiving…';
  try {
    const r = await fetch('/api/admin/archive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, action: 'archive', productId }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    btn.classList.add('done');
    btn.textContent = '✓ Archived';
    btn.closest('.card').classList.add('toggled');
    toast('Moved to archive.');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = orig;
    toast(e.message, false);
  }
}

function rendersGrid(items) {
  return items.map(p => {
    const name = escape(p.title || 'Untitled');
    const cat = escape(p.cat || '');
    const date = fmtDate(p.completed_at);
    const isLive = p.is_live;
    const pill = isLive
      ? `<span class="pill live">Live on site</span>`
      : `<span class="pill new">New render</span>`;
    const btnLabel = isLive ? 'Refresh on Site' : 'Publish to Site';
    const btnClass = isLive ? 'refresh' : 'publish';
    const safeProductId = p.product_id ? `'${p.product_id}'` : 'null';
    const audit = isLive ? escape(fmtAudit(p.last_action_by, p.last_action_at)) : '';
    const media = p.render_url
      ? `<div class="placeholder" data-src="${p.render_url}" onclick="loadVideo(this)"><div class="play-circle">▶</div><div class="label">Tap to play</div></div>`
      : `<div class="placeholder"><div class="label" style="opacity:0.5">no preview</div></div>`;
    return `<div class="card">
      <div class="video-wrap">${media}</div>
      <div class="body">
        ${pill}
        <div class="name">${name}</div>
        <div class="cat-line">${cat}</div>
        <div class="date">${date}</div>
        <div class="audit">${audit}</div>
        <button class="action ${btnClass}" onclick="publishRender('${p.id}', ${safeProductId}, this, ${isLive})">${btnLabel}</button>
      </div>
    </div>`;
  }).join('');
}

function productsGrid(items, mode) {
  return items.map(p => {
    const name = escape(p.name || 'Untitled');
    const date = fmtDate(p.created_at);
    const stockVid = p.video_file_url || p.video_url || '';
    const freshVid = p.fresh_render_url || '';
    const vid = freshVid || stockVid;
    const poster = p.thumbnail_url || p.image_url || '';
    const isActive = mode === 'active';
    const ribbon = (!isActive && freshVid) ? `<div class="ribbon">New render available</div>` : '';
    const media = vid
      ? `<div class="placeholder" data-src="${vid}" ${poster?`data-poster="${poster}"`:''} onclick="loadVideo(this)"><div class="play-circle">▶</div><div class="label">Tap to play</div></div>`
      : poster ? `<img src="${poster}" alt="">` : `<div class="placeholder"><div class="label" style="opacity:0.5">no preview</div></div>`;
    const btnHandler = isActive
      ? `archiveProduct('${p.id}', this)`
      : `smartRestore('${p.id}', this)`;
    const btnLabel = isActive ? 'Archive' : (freshVid ? 'Restore (Smart)' : 'Restore');
    const btnClass = isActive ? 'archive' : 'restore';
    const cardClass = isActive ? 'archive-mode' : '';
    const audit = escape(fmtAudit(p.last_action_by, p.last_action_at));
    return `<div class="card ${cardClass}">
      ${ribbon}
      <div class="video-wrap">${media}</div>
      <div class="body">
        <div class="name">${name}</div>
        <div class="date">${date}</div>
        <div class="audit">${audit}</div>
        <button class="action ${btnClass}" onclick="${btnHandler}">${btnLabel}</button>
      </div>
    </div>`;
  }).join('');
}

// Pretty-print a marketing draft filename like
// "2026-04-28-mothers-day-v3-kling-pro.mp4" → "Apr 28 · Mothers Day · v3 (Kling Pro)"
function prettyMarketingName(filename) {
  const stem = filename.replace(/\.mp4$/, '');
  const m = stem.match(/^(\d{4}-\d{2}-\d{2})-(.+?)-(v\d+)(?:-(.+))?$/);
  if (!m) return stem;
  const [, dateStr, occasion, version, model] = m;
  const occLabel = occasion.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
  const modelLabel = model ? ' (' + model.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join(' ') + ')' : '';
  let when = dateStr;
  try {
    const d = new Date(dateStr + 'T00:00:00');
    when = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  } catch {}
  return `${when} · ${occLabel} · ${version}${modelLabel}`;
}

function marketingGrid(items) {
  return items.map(p => {
    const pretty = escape(prettyMarketingName(p.name));
    const date = fmtDate(p.created_at);
    const sizeKb = p.size ? Math.round(p.size / 1024) : null;
    const ageMs = p.created_at ? (Date.now() - new Date(p.created_at).getTime()) : Infinity;
    const isNew = ageMs < 24 * 60 * 60 * 1000;
    const newPill = isNew ? `<span class="pill new">New</span>` : '';
    const sizeLine = sizeKb ? `<div class="cat-line">${sizeKb} KB · ${escape(p.name)}</div>` : `<div class="cat-line">${escape(p.name)}</div>`;
    // Inline <video controls> so Ak can tap to play. Audio ON for marketing
    // (commercials have dialogue / music) — different from bloom previews.
    return `<div class="card">
      <div class="video-wrap">
        <video src="${escape(p.url)}" controls preload="metadata" playsinline style="width:100%;height:100%;object-fit:cover;display:block"></video>
      </div>
      <div class="body">
        ${newPill}
        <div class="name">${pretty}</div>
        ${sizeLine}
        <div class="date">${date}</div>
        <button class="action archive" onclick="navigator.clipboard.writeText('${escape(p.url)}'); this.textContent='✓ URL copied'; setTimeout(()=>this.textContent='Copy URL', 1800)">Copy URL</button>
      </div>
    </div>`;
  }).join('');
}

async function load() {
  document.getElementById('stats').textContent = 'Loading…';
  document.getElementById('content').innerHTML = '';
  if (!TOKEN) {
    document.getElementById('content').innerHTML = '<div class="err">Missing access token. Bookmark URL must include <code>?token=…</code></div>';
    document.getElementById('stats').textContent = '';
    return;
  }
  try {
    const r = await fetch(`/api/admin/archive?token=${encodeURIComponent(TOKEN)}&category=${currentCat}&status=${currentMode}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');

    const label = CATEGORIES.find(c=>c[0]===currentCat)?.[1] || currentCat;

    if (currentMode === 'marketing') {
      const items = j.marketing || [];
      document.getElementById('stats').innerHTML = `<strong>${items.length}</strong> commercials in the marketing folder`;
      if (!items.length) {
        document.getElementById('content').innerHTML = `<div class="empty">No marketing drafts yet. Files in monique-videos/commercial_drafts/ will surface here.</div>`;
        return;
      }
      document.getElementById('content').innerHTML = `<div class="grid">${marketingGrid(items)}</div>`;
    } else if (currentMode === 'renders') {
      const items = j.renders || [];
      const liveCount = items.filter(x => x.is_live).length;
      const newCount = items.length - liveCount;
      document.getElementById('stats').innerHTML = `<strong>${items.length}</strong> renders · ${label} · <strong>${newCount}</strong> new, ${liveCount} live`;
      if (!items.length) {
        document.getElementById('content').innerHTML = `<div class="empty">No completed renders for this category.</div>`;
        return;
      }
      document.getElementById('content').innerHTML = `<div class="grid">${rendersGrid(items)}</div>`;
    } else {
      const items = j.products || [];
      const modeLabel = currentMode === 'active' ? 'on the site' : 'in the archive';
      document.getElementById('stats').innerHTML = `<strong>${items.length}</strong> ${modeLabel} · ${label}`;
      if (!items.length) {
        const empty = currentMode === 'active' ? 'Nothing live on the site for this category.' : 'Nothing in the archive for this category.';
        document.getElementById('content').innerHTML = `<div class="empty">${empty}</div>`;
        return;
      }
      document.getElementById('content').innerHTML = `<div class="grid">${productsGrid(items, currentMode)}</div>`;
    }
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="err">${e.message}</div>`;
    document.getElementById('stats').textContent = '';
  }
}

tabs(); load();

// Auto-refresh every 20s so Ak and Gamble see each other's changes
// without manually reloading. Skips when the tab is hidden (saves
// battery / bandwidth) and when a card video is currently open
// (preserves playback — load() rebuilds the grid HTML, which would
// destroy a playing <video> element).
let autoRefreshTimer = null;
function startAutoRefresh() {
  if (autoRefreshTimer) return;
  autoRefreshTimer = setInterval(() => {
    if (document.hidden) return;
    if (document.querySelector('.video-wrap video')) return;
    load();
  }, 20000);
}
function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  document.hidden ? stopAutoRefresh() : startAutoRefresh();
});
startAutoRefresh();
</script>
</body>
</html>
