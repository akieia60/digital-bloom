<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sort Blooms — Digital Bloom™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Outfit:wght@400;500;600;700&display=swap">
<style>
  /* Ak 10/25: she's the human in the loop — one bloom at a time, say what it
     is and who it's for, one tap to the next. */
  :root{ --navy:#0D1B36; --navy-2:#13254a; --ink:#091428; --gold:#D4AF37; --cream:#faf0ec;
    --muted:rgba(250,240,236,.6); --line:rgba(255,255,255,.1); --green:#5fbf7a;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--navy);color:var(--cream);font-family:'Outfit',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(110px + var(--sab))}
  header{position:sticky;top:0;z-index:20;background:rgba(13,27,54,.96);backdrop-filter:blur(12px);
    padding:calc(12px + var(--sat)) 16px 10px;border-bottom:1px solid var(--line)}
  .hrow{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .back{min-width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--cream)}
  h1{flex:1;margin:0;font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:20px;color:var(--gold)}
  .prog{font-size:13px;color:var(--muted);white-space:nowrap}
  .bar{max-width:560px;margin:8px auto 0;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
  .filters{max-width:560px;margin:10px auto 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .pill{flex:none;min-height:38px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13px;color:var(--muted);white-space:nowrap}
  .pill.on{border-color:var(--gold);background:rgba(212,175,55,.15);color:var(--gold);font-weight:600}
  select.pill{appearance:none;-webkit-appearance:none;font-family:inherit}

  .stage{margin-top:14px;position:relative;border-radius:22px;overflow:hidden;background:var(--ink);aspect-ratio:4/5;max-height:44vh;margin-left:auto;margin-right:auto;border:1px solid var(--line)}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tag{position:absolute;top:12px;left:12px;padding:6px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(9,20,40,.72)}
  .tag.ok{color:var(--green);border:1px solid rgba(95,191,122,.5)}
  .tag.ai{color:var(--gold);border:1px solid rgba(212,175,55,.5)}
  .name{margin:14px 0 4px;font-family:'Playfair Display',Georgia,serif;font-size:22px;line-height:1.2}
  .now{font-size:13px;color:var(--muted)}
  .read{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:14px;line-height:1.45}
  .read b{display:block;margin-bottom:3px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .read em{font-style:normal;color:var(--cream)}
  .read span{display:block;margin-top:4px;color:var(--muted);font-size:12px}

  h2{margin:22px 0 10px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:44px;padding:10px 15px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:15px;color:var(--cream)}
  .chip.sel{border-color:var(--gold);background:var(--gold);color:var(--navy);font-weight:600}
  .chip.cur:not(.sel){border-style:dashed;border-color:rgba(212,175,55,.6)}
  .chip.none{color:var(--muted)}

  /* Ak 10/25: say it in your own words — the chips follow what she types */
  .say{margin-top:22px}
  .say textarea{width:100%;min-height:64px;padding:13px 14px;border-radius:14px;border:1px solid rgba(212,175,55,.45);
    background:rgba(255,255,255,.05);color:var(--cream);font-family:inherit;font-size:16px;line-height:1.4;resize:vertical}
  .say textarea::placeholder{color:rgba(250,240,236,.4)}
  .say textarea:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.07)}
  .heard{margin-top:6px;font-size:13px;color:var(--muted);min-height:18px}
  .heard b{color:var(--gold);font-weight:600}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(13,27,54,0),var(--navy) 30%);padding:18px 16px calc(14px + var(--sab))}
  .dock .row{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .btn{height:56px;border-radius:16px;font-size:16px;font-weight:600}
  .btn.prev,.btn.skip{flex:none;width:70px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted);font-size:14px}
  .btn.go{flex:1;background:var(--gold);color:var(--navy)}
  .btn.go.save{background:#f0d36b}
  .btn:disabled{opacity:.45}

  .toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%) translateY(16px);opacity:0;
    z-index:40;display:flex;align-items:center;gap:14px;max-width:92vw;padding:12px 16px;border-radius:14px;
    background:#0a1631;border:1px solid rgba(212,175,55,.4);font-size:14px;transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast button{color:var(--gold);font-weight:700;font-size:14px;min-height:36px}
  .empty{margin-top:40px;text-align:center;color:var(--muted);line-height:1.6}
  .empty b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:24px;color:var(--cream);margin-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="back" id="toArchive" href="archive.html" aria-label="Back to the archive">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1>Sort Blooms</h1>
    <div class="prog" id="prog">Loading…</div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="filters" id="filters">
    <button class="pill on" data-mode="needs">Needs your eye</button>
    <button class="pill" data-mode="all">Everything</button>
    <select class="pill" id="occPick" aria-label="Just one occasion"><option value="">One occasion…</option></select>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="dock">
  <div class="row">
    <button class="btn prev" id="prev" aria-label="Previous">← Back</button>
    <button class="btn go" id="go">✓ Looks right</button>
    <button class="btn skip" id="skip">Skip</button>
  </div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo">Undo</button></div>

<script>
(function(){
"use strict";
const token = new URLSearchParams(location.search).get('token') || '';
const API = '/api/admin/archive';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#toArchive').href = 'archive.html?token=' + encodeURIComponent(token);

let options = [], products = [], hints = {}, queue = [], pos = 0, mode = 'needs', occFilter = '';
let pick = { category:null, subcategory:null, note:'' }, lastSave = null, tT, hearT;

const opt = slug => options.find(o=>o.slug===slug);
const catLabel = slug => (opt(slug)||{label:slug}).label;
const whoLabel = (cat, sub) => { if(!sub) return 'No one specific'; const w=(opt(cat)?.who||[]).find(x=>x.slug===sub); return w ? w.label : sub; };

// Needs your eye: not yet confirmed by a person, ordered by what most needs
// checking — blooms the AI moved today, then the ones it wasn't sure about.
function rank(p){
  const h = hints[p.id] || {};
  if(h.moved) return 0;
  if(h.conf==='low' || !h.conf) return 1;
  if(h.conf==='medium') return 2;
  return 3;
}
function buildQueue(){
  let list = products.slice();
  if(occFilter) list = list.filter(p=>p.category===occFilter);
  if(mode==='needs') list = list.filter(p=>!p.category_reviewed_at && rank(p)<3).sort((a,b)=>rank(a)-rank(b));
  queue = list; pos = 0;
}

function toast(msg, withUndo){
  $('#toastMsg').textContent = msg; $('#undo').style.display = withUndo ? '' : 'none';
  $('#toast').classList.add('on'); clearTimeout(tT); tT = setTimeout(()=>$('#toast').classList.remove('on'), 4200);
}

function paint(){
  const total = queue.length;
  $('#prog').textContent = total ? `${Math.min(pos+1,total)} of ${total}` : '0 left';
  $('#barFill').style.width = total ? (pos/total*100)+'%' : '100%';
  $('#prev').disabled = pos===0;
  const p = queue[pos];
  if(!p){
    $('#main').innerHTML = `<div class="empty"><b>${mode==='needs'?'All caught up':'Nothing here'}</b>
      ${mode==='needs'?'Every bloom that needed a second look has been checked.<br>Tap “Everything” to go through the rest.':'Pick another occasion.'}</div>`;
    $('#go').disabled = true; $('#skip').disabled = true; return;
  }
  $('#go').disabled = false; $('#skip').disabled = false;
  const h = hints[p.id] || {};
  const badge = p.category_reviewed_at ? `<div class="tag ok">✓ Checked by ${esc(p.category_reviewed_by||'you')}</div>`
              : h.moved ? `<div class="tag ai">AI moved this today</div>` : '';
  $('#main').innerHTML = `
    <div class="stage">
      <video src="${esc(p.video_url)}" ${p.thumbnail_url?`poster="${esc(p.thumbnail_url)}"`:''} autoplay muted loop playsinline></video>${badge}
    </div>
    <div class="name">${esc(p.name)}</div>
    <div class="now">Now: <b>${esc(catLabel(p.category))}</b> · ${esc(whoLabel(p.category,p.subcategory))}</div>
    ${h.read ? `<div class="read"><b>What's written in the film</b><em>“${esc(h.read)}”</em>${h.why?`<span>${esc(h.why)}</span>`:''}</div>` : ''}
    <div class="say">
      <h2 style="margin-top:0">Say it in your words</h2>
      <textarea id="say" rows="2" placeholder="e.g. “birthday, for anyone” or “this should be for our daughter”">${esc(pick.note)}</textarea>
      <div class="heard" id="heard"></div>
    </div>
    <div id="chipArea"></div>`;
  paintChips();
}
// only the chips redraw while she types, so the bubble keeps its place
function paintChips(){
  const p = queue[pos]; if(!p) return;
  const o = opt(pick.category) || {who:[]};
  const changed = pick.category!==p.category || (pick.subcategory||null)!==(p.subcategory||null)
               || (pick.note||'').trim()!==(p.category_note||'');
  $('#chipArea').innerHTML = `
    <h2>What is it?</h2>
    <div class="chips">${options.map(c=>`<button class="chip${c.slug===pick.category?' sel':''}${c.slug===p.category?' cur':''}" data-cat="${esc(c.slug)}">${esc(c.label)}</button>`).join('')}</div>
    <h2>Who is it for?</h2>
    <div class="chips">
      <button class="chip none${!pick.subcategory?' sel':''}" data-sub="">Anyone · no one specific</button>
      ${o.who.map(w=>`<button class="chip${w.slug===pick.subcategory?' sel':''}${(pick.category===p.category && w.slug===p.subcategory)?' cur':''}" data-sub="${esc(w.slug)}">${esc(w.label)}</button>`).join('')}
    </div>`;
  $('#go').textContent = changed ? 'Save & next →' : '✓ Looks right';
  $('#go').classList.toggle('save', changed);
}

/* ---------- hearing what she typed ----------
   Matches whole words against the occasion names and the people for that
   occasion; the longest match wins ("for her" beats "her"). Whatever doesn't
   match a chip is still saved as her note, so Deuce can add a new shelf. */
const CAT_WORDS = { 'bday':'birthday', 'b-day':'birthday', 'mothers day':'mothers-day', 'mom day':'mothers-day',
  'fathers day':'fathers-day', 'dad day':'fathers-day', 'thanks':'thank-you', 'congrats':'celebration',
  'congratulations':'celebration', 'romance':'love', 'romantic':'love', 'valentines':'valentine', 'valentines day':'valentine',
  'memorial':'grief', 'in memory':'grief', 'condolences':'sympathy', 'grad':'graduation', 'friend':'friendship',
  'appreciation':'acknowledgement', 'pride':'holidays', 'xmas':'christmas' };
const ANYONE = /\b(anyone|anybody|everyone|everybody|no one specific|nobody specific|any one|general|for all)\b/;
const norm = s => ' ' + String(s||'').toLowerCase().replace(/[’']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim() + ' ';
const has = (text, phrase) => phrase && text.includes(' ' + phrase + ' ');
function best(text, pairs){                 // pairs: [phrase, value]
  let hit = null;
  for(const [ph, v] of pairs){ const n = norm(ph).trim(); if(n && has(text, n) && (!hit || n.length > hit[0].length)) hit = [n, v]; }
  return hit;
}
function hear(raw){
  const text = norm(raw).replace(/ (my|our|the|a|an|this|is|its|it s|should|be) /g,' ').replace(/ (my|our|the|a|an|this|is|its|should|be) /g,' ');
  const heard = [];
  const catPairs = [];
  options.forEach(c=>{ catPairs.push([c.label, c.slug], [c.slug.replace(/-/g,' '), c.slug]); });
  Object.entries(CAT_WORDS).forEach(([w,slug])=>{ if(opt(slug)) catPairs.push([w, slug]); });
  const c = best(text, catPairs);
  if(c && c[1]!==pick.category){
    pick.category = c[1];
    const o = opt(c[1]); if(!o || !o.who.some(w=>w.slug===pick.subcategory)) pick.subcategory = null;
  }
  if(c) heard.push(catLabel(c[1]));
  const o = opt(pick.category) || {who:[]};
  const whoPairs = [];
  o.who.forEach(w=>{
    const l = w.label.toLowerCase();
    whoPairs.push([l, w.slug], [l.replace(/^for (a |an |my |the )?/,''), w.slug],
                  [w.slug.replace(/-/g,' '), w.slug], [w.slug.replace(/^for-/,'').replace(/-/g,' '), w.slug]);
  });
  const w = best(text, whoPairs);
  if(w){ pick.subcategory = w[1]; heard.push(whoLabel(pick.category, w[1])); }
  else if(ANYONE.test(text)){ pick.subcategory = null; heard.push('Anyone'); }
  $('#heard').innerHTML = raw.trim()
    ? (heard.length ? `Heard → <b>${esc(heard.join(' · '))}</b>. ` : '') + 'Your words are saved with this bloom.'
    : '';
  paintChips();
}

function load(i){
  pos = Math.max(0, Math.min(i, queue.length));
  const p = queue[pos];
  if(p) pick = { category:p.category, subcategory:p.subcategory||null, note:p.category_note||'' };
  paint(); window.scrollTo({top:0});
}

async function save(){
  const p = queue[pos]; if(!p) return;
  const before = { category:p.category, subcategory:p.subcategory||null, note:p.category_note||'', clearReview: !p.category_reviewed_at };
  const after = { category:pick.category, subcategory:pick.subcategory||null, note:(pick.note||'').trim() };
  $('#go').disabled = true;
  try{
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, action:'recategorize', productId:p.id, ...after }) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || r.status);
    Object.assign(p, j.product);
    lastSave = { p, before, index:pos };
    const moved = before.category!==after.category || before.subcategory!==after.subcategory;
    toast(moved ? `Moved to ${catLabel(after.category)} · ${whoLabel(after.category, after.subcategory)}` : 'Checked ✓', true);
    load(pos+1);
  }catch(e){
    toast('Couldn’t save — ' + e.message, false); $('#go').disabled = false;
  }
}

async function undo(){
  if(!lastSave) return;
  const { p, before, index } = lastSave; lastSave = null;
  try{
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, action:'recategorize', productId:p.id, ...before }) });
    const j = await r.json(); if(!r.ok) throw new Error(j.error || r.status);
    Object.assign(p, j.product);
    toast('Put back', false); load(index);
  }catch(e){ toast('Couldn’t undo — ' + e.message, false); }
}

document.addEventListener('click', e=>{
  const c = e.target.closest('[data-cat]');
  if(c){ const slug=c.dataset.cat; if(slug!==pick.category){
      pick.category = slug;
      const o = opt(slug);
      // keep the same person if the new occasion has them, otherwise clear
      if(!o || !o.who.some(w=>w.slug===pick.subcategory)) pick.subcategory = null;
    } paintChips(); return; }
  const s = e.target.closest('[data-sub]');
  if(s){ pick.subcategory = s.dataset.sub || null; paintChips(); return; }
  const m = e.target.closest('[data-mode]');
  if(m){ mode = m.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on', x===m)); buildQueue(); load(0); }
});
document.addEventListener('input', e=>{
  if(e.target.id!=='say') return;
  pick.note = e.target.value; clearTimeout(hearT); hearT = setTimeout(()=>hear(pick.note), 250);
});
$('#occPick').addEventListener('change', e=>{ occFilter = e.target.value; buildQueue(); load(0); });
$('#go').onclick = save;
$('#skip').onclick = ()=> load(pos+1);
$('#prev').onclick = ()=> load(pos-1);
$('#undo').onclick = undo;

Promise.all([
  fetch(`${API}?token=${encodeURIComponent(token)}&status=sort`).then(r=>r.ok?r.json():Promise.reject(r.status)),
  fetch('sort-hints.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).catch(()=>({})),
]).then(([data, h])=>{
  options = data.options; products = data.products; hints = h;
  $('#occPick').innerHTML = '<option value="">One occasion…</option>' +
    options.filter(o=>products.some(p=>p.category===o.slug)).map(o=>`<option value="${esc(o.slug)}">${esc(o.label)} (${products.filter(p=>p.category===o.slug).length})</option>`).join('');
  buildQueue(); load(0);
}).catch(err=>{
  $('#prog').textContent = '';
  $('#main').innerHTML = `<div class="empty"><b>Can’t open</b>${err===401?'This link needs your archive token.':'Couldn’t load the blooms. Pull down to try again.'}</div>`;
});
})();
</script>
</body>
</html>
